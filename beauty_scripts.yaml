- id: 1
  title: Kajal smudge-proof hacks
  hook: Kajal phail jaata hai?
  hook_en: Kajal smudges by afternoon?
  palette: blush pink, nude beige and soft gold color palette
  scenes:
  - en: Does your kajal smudge by afternoon? Try these four simple tricks.
    queries:
    - eye makeup
    - eyelashes
    image: close-up side profile of a young Indian woman looking down, only her eye and cheek visible, black kajal slightly smudged under the lower lash line, a strand of hair across, warm afternoon sunlight,
      face partly out of frame
    hi: दोपहर तक काजल फैल जाता है? ये चार ट्रिक्स ट्राई करो।
    hinglish: Dopahar tak kajal phail jaata hai? Ye chaar tricks try karo.
  - en: First, pat a little compact powder under your eyes to soak up oil.
    queries:
    - eye makeup
    - makeup products
    image: a woman's hand with nude manicured nails gently pressing a fluffy beige powder puff into an open round pressed compact powder, on a white marble vanity with pink roses
    hi: पहला, आँखों के नीचे हल्का सा कॉम्पैक्ट पाउडर लगाओ, ऑयल सोख लेगा।
    hinglish: Pehla, aankhon ke neeche halka sa compact powder lagao, oil sokh lega.
  - en: Second, apply kajal only on the outer half of your lash line, not the whole line.
    queries:
    - eye makeup
    - eyelashes
    image: extreme close-up side profile of an Indian woman's eye with a neat sharp black kajal line on the outer half of the upper lash line, long lashes, dewy glowing skin, face partly out of frame
    hi: दूसरा, काजल सिर्फ़ बाहर के कोने से बीच तक लगाओ, पूरी लाइन पर नहीं।
    hinglish: Doosra, kajal sirf bahar ke kone se beech tak lagao, poori line par nahin.
  - en: Third, set that kajal with black eyeshadow on top, and it will lock in place.
    queries:
    - eyeshadow
    - eye makeup
    image: a small angled makeup brush dipping into matte black eyeshadow in an open eyeshadow palette of nude, pink and black shades, held by a hand with nude nails, close-up
    hi: तीसरा, उसी काजल के ऊपर ब्लैक आईशैडो से सेट करो, ये लॉक हो जाएगा।
    hinglish: Teesra, usi kajal ke upar black eyeshadow se set karo, ye lock ho jaayega.
  - en: Fourth, budget tip, pick a waterproof kajal, good ones cost very little.
    queries:
    - makeup products
    - cosmetics
    image: three plain unlabeled black kajal pencils lying on blush pink silk fabric with small gold jhumka earrings and rose petals, flat-lay from directly above
    hi: 'चौथा, बजट टिप: वॉटरप्रूफ़ काजल लो, सौ रुपये में भी अच्छे मिलते हैं।'
    hinglish: 'Chautha, budget tip: waterproof kajal lo, sau rupaye mein bhi achhe milte hain.'
  - en: Now your kajal will last all day! Save this and follow @dhruviverse.official for more.
    queries:
    - makeup
    - beauty products
    image: 'aesthetic makeup vanity flat-lay from above: black kajal pencil, nude lipstick, small round mirror, gold earrings, pink roses and a cup of chai, soft morning light'
    hi: अब काजल पूरा दिन टिकेगा! सेव करो और फ़ॉलो करो ध्रुवीवर्स।
    hinglish: Ab kajal poora din tikega! Save karo aur follow karo @dhruviverse.official
  caption: 'Kajal dopahar tak phail jaata hai? 😩 Ye 4 hacks try karo 👇

    1. Aankhon ke neeche compact powder

    2. Kajal sirf outer half pe

    3. Black eyeshadow se set karo

    4. Budget waterproof kajal (₹100 mein bhi milta hai)

    Save karo for later 💾 Follow @dhruviverse.official for daily affordable beauty tips 💕'
  caption_en: 'Kajal smudging by afternoon? 😩 Try these 4 easy steps 👇

    1. Compact powder under eyes

    2. Kajal only on outer half

    3. Set with black eyeshadow

    4. Budget waterproof kajal pick

    Save this for later 💾 Follow @dhruviverse.official for daily affordable beauty tips 💕'
