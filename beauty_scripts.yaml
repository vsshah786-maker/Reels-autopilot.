- id: 2
  title: Winged liner for beginners
  hook: Winged liner tedha banta hai?
  hook_en: Winged liner looks messy?
  palette: dusty rose, mauve and champagne gold color palette
  scenes:
  - en: Does your winged liner come out crooked every time? Try this simple method.
    queries:
    - eye makeup
    - eyelashes
    image: extreme close-up side profile of a young Indian woman's eye looking down, slightly uneven black winged eyeliner, long lashes, soft window light, face partly out of frame
    hi: विंग्ड लाइनर हर बार टेढ़ा बनता है? ये आसान तरीका ट्राई करो।
    hinglish: Winged liner har baar tedha banta hai? Ye aasaan tareeka try karo.
  - en: First, draw a short line going outward from your lower lash line.
    queries:
    - eye makeup
    - eyelashes
    image: extreme close-up side profile of an Indian woman's closed eye with a short thin black flick drawn at the outer corner, extending the lower lash line, face partly out of frame
    hi: स्टेप वन, निचली लैश लाइन की सीध में बाहर की तरफ़ छोटी लाइन खींचो।
    hinglish: Step one, nichli lash line ki seedh mein bahar ki taraf chhoti line kheencho.
  - en: Second, connect the tip of the wing to the middle of your eyelid with a straight line.
    queries:
    - eye makeup
    - eyelashes
    image: extreme close-up side profile of an Indian woman's eye with an outlined black triangle wing joining the flick to the middle of the upper lid, face partly out of frame
    hi: स्टेप टू, विंग की नोक से पलक के बीच तक एक सीधी लाइन जोड़ो।
    hinglish: Step two, wing ki nok se palak ke beech tak ek seedhi line jodo.
  - en: Third, fill in the gap and check it in the mirror with your eye open.
    queries:
    - woman mirror
    - eye makeup
    image: side profile of an Indian woman looking into a round vanity mirror with fairy lights, holding a plain black liquid eyeliner pen, only her eye and cheek visible
    hi: स्टेप थ्री, खाली जगह भर दो, आँख खुली रखकर शीशे में देखो।
    hinglish: Step three, khaali jagah bhar do, aankh khuli rakhkar sheeshe mein dekho.
  - en: Fourth, if you make a mistake, clean it with a cotton bud dipped in micellar water.
    queries:
    - makeup products
    - cosmetics
    image: close-up of a plain cotton bud and a small clear unlabeled bottle of micellar water on a mauve silk cloth beside a black eyeliner pen, soft light
    hi: स्टेप फ़ोर, गलती हो तो माइसेलर वॉटर में डूबी कॉटन बड से साफ़ करो।
    hinglish: Step four, galti ho to micellar water mein doobi cotton bud se saaf karo.
  - en: Your perfect wing is ready! Save this and follow @dhruviverse.official for more.
    queries:
    - makeup
    - beauty products
    image: extreme close-up side profile of an Indian woman's eye with a sharp clean black winged eyeliner and long lashes, small gold jhumka visible, champagne glow, face partly out of frame
    hi: बस, परफ़ेक्ट विंग तैयार! सेव करो और फ़ॉलो करो ध्रुवीवर्स।
    hinglish: Bas, perfect wing taiyaar! Save karo aur follow karo @dhruviverse.official
  caption: 'Winged liner tedha banta hai? 😩 Beginners ke liye easy method 👇

    1. Lower lash line ki seedh mein flick

    2. Nok se lid ke beech tak line

    3. Gap bharo, aankh khuli rakho

    4. Galti? Micellar water + cotton bud

    Save karo for later 💾 Follow @dhruviverse.official for daily affordable beauty tips 💕'
  caption_en: 'Winged liner coming out messy? 😩 Try these 4 easy steps 👇

    1. Short line from lower lash

    2. Connect tip to middle

    3. Fill in the gap

    4. Fix mistakes with micellar water

    Save this for later 💾 Follow @dhruviverse.official for daily affordable beauty tips 💕'
