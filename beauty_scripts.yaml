- id: 5
  title: Blush placement for your face shape
  hook: Blush galat jagah?
  hook_en: Blush in the wrong spot?
  palette: blush pink, nude beige and soft gold color palette
  scenes:
  - en: Putting blush in the wrong spot can make your face look heavy. Match it to your shape.
    queries:
    - blush
    - smiling woman
    image: side profile of a young Indian woman's cheek with soft pink blush, eyes looking away, hair tucked behind ear, face partly out of frame, soft window light
    hi: ब्लश गलत जगह लगाओ तो चेहरा भारी दिखता है। फ़ेस शेप से लगाओ!
    hinglish: Blush galat jagah lagao to chehra bhaari dikhta hai. Face shape se lagao!
  - en: For a round face, sweep blush upward from your cheeks toward your ears.
    queries:
    - blush
    - smiling woman
    image: close-up of a fluffy angled brush sweeping pink blush upward along the cheekbone toward the ear, side profile, face partly out of frame
    hi: गोल चेहरा? ब्लश गालों के ऊपर से कान की तरफ़ तिरछा लगाओ।
    hinglish: Gol chehra? Blush gaalon ke upar se kaan ki taraf tircha lagao.
  - en: For a long face, spread blush straight across the apples of your cheeks to shorten it.
    queries:
    - blush
    - contour
    image: close-up side profile of a cheek with soft pink blush blended horizontally across the apple of the cheek, face partly out of frame
    hi: लंबा चेहरा? ब्लश गालों के एप्पल्स पर सीधा आड़ा फैलाओ, इससे चेहरा छोटा लगेगा।
    hinglish: Lamba chehra? Blush gaalon ke apples par seedha aada phailao, isse chehra chhota lagega.
  - en: For a heart shaped face, dab light circles of blush just below the apples of your cheeks.
    queries:
    - blush
    - contour
    image: close-up of a soft round brush dabbing blush just below the apple of the cheek in a small circle, side profile, face partly out of frame
    hi: दिल जैसा चेहरा? ब्लश गालों के एप्पल्स के नीचे हल्का गोल-गोल लगाओ।
    hinglish: Dil jaisa chehra? Blush gaalon ke apples ke neeche halka gol-gol lagao.
  - en: Always start light, and tap your brush on your hand first to remove extra powder.
    queries:
    - makeup brush
    - blush
    image: close-up of a fluffy blush brush being tapped on the back of a hand to remove excess pink powder, plain unlabeled blush compact nearby, marble vanity
    hi: और हमेशा कम से शुरू करो, ब्रश पहले हाथ पर झाड़ लो।
    hinglish: Aur hamesha kam se shuru karo, brush pehle haath par jhaad lo.
  - en: Your natural flush is ready! Save this and follow @dhruviverse.official for more.
    queries:
    - blush
    - beauty products
    image: 'flat-lay from above: plain unlabeled pink blush compact, fluffy brush, gold hoop earrings and pink roses on nude beige silk'
    hi: बस, नैचुरल फ़्लश तैयार! सेव करो और फ़ॉलो करो ध्रुवीवर्स।
    hinglish: Bas, natural flush taiyaar! Save karo aur follow karo @dhruviverse.official
  caption: 'Blush ko face shape ke hisaab se lagao 🌸👇

    1. Gol chehra: upar ki taraf tircha

    2. Lamba chehra: apples pe aada

    3. Heart shape: apples ke neeche

    4. Hamesha kam se shuru karo

    Save karo for later 💾 Follow @dhruviverse.official for daily affordable beauty tips 💕'
  caption_en: 'Blush in the wrong spot? 😩 Match it to your face shape 👇

    1. Round face, sweep upward

