- id: 3
  title: Lipstick that lasts all day
  hook: Lipstick chai ke saath gayab?
  hook_en: Lipstick gone by lunch?
  palette: peach, cream and rose gold color palette
  scenes:
  - en: Want your lipstick to stay fresh all day? Try these four easy steps.
    queries:
    - pixabay:306150
    - lip gloss
    image: close-up of a white ceramic cup of masala chai with a faint peach lipstick mark on the rim, on a cream table with rose gold spoon, warm morning light
    hi: लिपस्टिक चाय पीते ही गायब हो जाती है? ये चार स्टेप्स अपनाओ।
    hinglish: Lipstick chai peete hi gayab ho jaati hai? Ye chaar steps apnao.
  - en: First, pick a matte lipstick. Matte formulas stay on much longer than glossy ones.
    queries:
    - pixabay:189018
    - lipstick
    image: extreme close-up of soft glossy lips with a thin layer of clear lip balm, chin and nose out of frame, peach background, soft light
    hi: पहला, होंठों पर हल्का लिप बाम लगाओ, फिर टिशू से एक्स्ट्रा पोंछ दो।
    hinglish: Pehla, honthon par halka lip balm lagao, phir tissue se extra ponchh do.
  - en: Second, apply one thin coat, using a small mirror to follow your lip line.
    queries:
    - pixabay:46450
    - applying lipstick
    image: extreme close-up of lips being filled in with a plain unlabeled peach-brown lip liner pencil held in one hand, face out of frame
    hi: दूसरा, लिप लाइनर से पूरे होंठ भर दो, ये बेस का काम करेगा।
    hinglish: Doosra, lip liner se poore honth bhar do, ye base ka kaam karega.
  - en: Third, wait one minute, then add a second thin coat. Two thin coats last longer.
    queries:
    - pixabay:351570
    - applying lipstick
    image: extreme close-up of lips with fresh peach-coral lipstick next to a plain white tissue with a lip blot print, face out of frame
    hi: तीसरा, लिपस्टिक लगाओ, टिशू से ब्लॉट करो और दोबारा एक कोट लगाओ।
    hinglish: Teesra, lipstick lagao, tissue se blot karo aur dobara ek coat lagao.
  - en: Fourth, dust a little powder on your face with a fluffy brush, so oil cannot melt your makeup.
    queries:
    - pixabay:270065
    - makeup brush
    image: close-up of a fluffy brush with translucent powder held over a thin white tissue placed on peach lips, face out of frame, cream background
    hi: चौथा, टिशू ऊपर रखकर हल्का सा ट्रांसलूसेंट पाउडर थपथपाओ, कलर लॉक हो जाएगा।
    hinglish: Chautha, tissue upar rakhkar halka sa translucent powder thapthapao, color lock ho jaayega.
  - en: Now smile, your colour will stay put! Save this and follow @dhruviverse.official for more.
    queries:
    - pixabay:109470
    - lips
    image: 'flat-lay from above: plain unlabeled peach lipstick bullet, a lip liner, a cup of chai, rose gold earrings and cream roses on a peach linen cloth'
    hi: अब चाय भी पियो, लिपस्टिक टिकेगी! सेव करो और फ़ॉलो करो ध्रुवीवर्स।
    hinglish: Ab chai bhi piyo, lipstick tikegi! Save karo aur follow karo @dhruviverse.official
  caption: 'Chai pi aur lipstick gayab? ☕💄 Ye 4 steps 👇

    1. Lip balm, extra ponchh do

    2. Liner se poore lips fill

    3. Lipstick, blot, ek aur coat

    4. Tissue ke upar se translucent powder

    Save karo for later 💾 Follow @dhruviverse.official for daily affordable beauty tips 💕'
  caption_en: 'Lipstick gone by lunch? 💄 Try these 4 steps 👇

    1. Pick a matte lipstick

    2. One thin coat, use a small mirror

    3. Wait a minute, add a second thin coat

    4. Dust powder on your face to keep oil away

    Save this for later 💾 Follow @dhruviverse.official for daily affordable beauty tips 💕'
