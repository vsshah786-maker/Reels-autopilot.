# BEAUTY REEL SCRIPTS (used when content_mode: beauty and there is no GEMINI_API_KEY, or Gemini is busy)
# One reel per day, in order. Each scene:
#   en       = what the English voice says AND the captions (language: english)
#   queries  = words to find the real makeup video clip for this step ("pixabay:123456" = one exact clip)
#   image    = what the AI picture shows (faceless-friendly: products, hands, mirror, side profile)
