- id: 6
  title: Cakey foundation fix
  hook: Foundation cakey dikhta hai?
  hook_en: Foundation looking cakey?
  palette: peach, cream and rose gold color palette
  scenes:
  - en: Does your foundation look cakey and patchy right after applying it? Here is the mistake.
    queries:
    - applying foundation
    - makeup
    image: extreme close-up of a cheek with dry cakey foundation settling into texture, side profile, face partly out of frame, harsh daylight
    hi: फ़ाउंडेशन लगाते ही केकी और पैची दिखता है? गलती यहाँ है।
    hinglish: Foundation lagate hi cakey aur patchy dikhta hai? Galti yahan hai.
  - en: First, apply moisturizer and let it sit for a couple of minutes to absorb.
    queries:
    - moisturizer
    - face cream
    image: close-up of a hand holding a plain unlabeled white jar of moisturiser with a dollop on the fingertip, peach background, soft light
    hi: नंबर एक, पहले मॉइस्चराइज़र लगाओ और दो मिनट सूखने दो।
    hinglish: Number ek, pehle moisturiser lagao aur do minute sookhne do.
  - en: Second, use less foundation, just a few drops are more than enough.
    queries:
    - applying foundation
    - makeup brush
    image: close-up of three small drops of liquid foundation on the back of a hand beside a plain unlabeled glass dropper bottle, cream background
