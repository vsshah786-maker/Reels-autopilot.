- id: 4
  title: Lipstick shades for wheatish and dusky skin
  hook: Kaunsa shade jachega?
  hook_en: Which lipstick shade suits you?
  palette: warm terracotta, nude and gold color palette
  scenes:
  - en: Which lipstick shade suits wheatish or dusky skin the best? Listen closely.
    queries:
    - lipstick
    - lips
    image: row of five plain unlabeled lipstick bullets in brownish nude, mauve, brick red, wine and berry on warm terracotta fabric, close-up, soft side light
    hi: गेहुँआ या डस्की स्किन पर कौन सा लिपस्टिक शेड जंचेगा? सुनो।
    hinglish: Gehuan ya dusky skin par kaun sa lipstick shade jachega? Suno.
  - en: First, avoid very light pink nude shades, they can make lips look grey and pale.
    queries:
    - lipstick
    - lips
    image: extreme close-up of full lips on warm dusky Indian skin wearing a very pale pastel pink lipstick that looks washed out, face out of frame
    hi: पहला, बहुत लाइट पिंक न्यूड से बचो, होंठ ग्रे और फीके दिखेंगे।
    hinglish: Pehla, bahut light pink nude se bacho, honth grey aur pheeke dikhenge.
  - en: Second, pick a brownish nude or mauve for everyday wear, it looks very natural.
    queries:
    - lipstick
    - applying lipstick
    image: extreme close-up of lips on warm wheatish Indian skin wearing a soft brownish nude lipstick, natural glow, face out of frame
    hi: दूसरा, रोज़ के लिए ब्राउनिश न्यूड या मोव चुनो, बहुत नैचुरल लगता है।
    hinglish: Doosra, roz ke liye brownish nude ya mauve chuno, bahut natural lagta hai.
  - en: Third, for parties try brick red, wine, or deep berry shades.
    queries:
    - lipstick
    - applying lipstick
    image: side profile close-up of an Indian woman's lips in rich brick red lipstick with a gold nose pin and gold jhumka, eyes out of frame, warm evening light
    hi: तीसरा, पार्टी के लिए ब्रिक रेड, वाइन या डीप बेरी शेड ट्राई करो।
    hinglish: Teesra, party ke liye brick red, wine ya deep berry shade try karo.
  - en: Fourth, always test the shade on your fingertip, not the back of your hand.
    queries:
    - lipstick
    - woman mirror
    image: close-up of a hand with warm brown skin showing three small lipstick swatches on the fingertips, terracotta and nude, soft daylight
    hi: चौथा, शेड हमेशा उंगली के पोर पर टेस्ट करो, हाथ के पीछे नहीं।
    hinglish: Chautha, shade hamesha ungli ke por par test karo, haath ke peeche nahin.
  - en: The right shade changes your whole look! Save this and follow @dhruviverse.official for more.
    queries:
    - lipstick
    - beauty products
    image: 'flat-lay from above: plain unlabeled terracotta and wine lipsticks, gold jhumkas, dried rose petals and a small round mirror on nude linen'
    hi: सही शेड, पूरा लुक बदल देगा! सेव करो और फ़ॉलो करो ध्रुवीवर्स।
    hinglish: Sahi shade, poora look badal dega! Save karo aur follow karo @dhruviverse.official
  caption: 'Wheatish ya dusky skin? Ye shades try karo 💄✨

    1. Bahut light pink nude avoid

    2. Daily: brownish nude ya mauve

    3. Party: brick red, wine, berry

    4. Fingertip pe test karo

    Save karo for later 💾 Follow @dhruviverse.official for daily affordable beauty tips 💕'
  caption_en: 'Which lipstick shade suits you? 💄 Here are 4 quick tips 👇

    1. Skip very light nudes

    2. Brownish nude or mauve daily

    3. Brick red or berry for parties

    4. Always test on your fingertip

    Save this for later 💾 Follow @dhruviverse.official for daily affordable beauty tips 💕'
