# ================================================================
#  YOUR CONTENT LIST  -  one reel per entry, posted from top to bottom.
#
#  type    = tip / fact / quote / find   (each type has its own look)
#            Don't want a type? Delete those entries, or turn the type off
#            in config.yaml -> content_types.
#  id      = any unique number (never reuse a number)
#  hook    = the big first line (stops the scroll). Keep it short!
#            For a quote, this is the quote itself.
#  tips    = 3 or 4 short lines (max ~12 words each). Quotes: leave as []
#  cta     = last screen ("Save this", "Comment ...", "Follow ...")
#  search  = English words used to find matching free background videos
#  hashtags= extra hashtags for this reel only
#
#  To add a reel: copy one block (from "- id:" down to "hashtags:"),
#  paste it at the bottom and change the words. Spaces at the start matter!
#  Meesho finds are generic ideas - no prices or fake product claims.
# ================================================================

- id: 1
  type: tip
  hook: "Kajal smudges by noon? Try this"
  tips:
    - "Apply a thin layer of loose powder under your eyes first"
    - "Line with kajal, then set it with matching eyeshadow"
    - "Keep it off the lower waterline if your eyes water"
    - "Clean the edge with a cotton bud dipped in moisturiser"
  cta: "Save this for your next long day"
  search: ["eye makeup", "eyeliner", "makeup closeup"]
  hashtags: ["#kajal", "#eyemakeup", "#smudgeproof"]

