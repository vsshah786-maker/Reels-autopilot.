# ================================================================
#  KIDS STORIES  (used when content_mode: story and Gemini is off / not working)
#  One story is used per day, in order, never repeating until all are used.
#  To add your own: copy a whole block, give it a NEW id, keep 5-7 scenes.
#  hi = Hindi (Devanagari) | hinglish = same words in Roman letters (same number of words!) | en = English
# ================================================================

- id: 1
  title_hi: "प्यासा कौआ"
  title_hinglish: "Pyaasa Kauwa"
  title_en: "The Thirsty Crow"
  character: "a small cute black baby crow with big shiny round eyes and a tiny bright blue scarf"
  moral_hi: "हिम्मत और समझदारी से हर मुश्किल आसान है।"
  moral_hinglish: "Himmat aur samajhdaari se har mushkil aasaan hai."
  moral_en: "Think smart and never give up."
  tags: ["thirsty crow", "panchatantra", "moral story"]
  scenes:
    - image: "the crow flying happily in a bright blue sky over a sunny Indian village with mud houses, hot summer day"
      hi: "गर्मी का दिन था। एक छोटा कौआ आसमान में उड़ रहा था।"
      hinglish: "Garmi ka din tha. Ek chhota kauwa aasmaan mein ud raha tha."
      en: "It was a hot summer day. A little crow was flying in the sky."
    - image: "the crow sitting on a dry tree branch looking tired and very thirsty, tongue out, dry cracked ground below"
      hi: "उसे बहुत ज़ोर की प्यास लगी थी। पर पानी कहीं नहीं था।"
      hinglish: "Use bahut zor ki pyaas lagi thi. Par paani kahin nahin tha."
      en: "He was very, very thirsty. But there was no water anywhere."
    - image: "the crow standing on the rim of a tall brown clay pot in a garden, peeking inside, surprised face"
      hi: "तभी उसे एक घड़ा दिखा। पर पानी बहुत नीचे था!"
      hinglish: "Tabhi use ek ghada dikha. Par paani bahut neeche tha!"
      en: "Then he saw a clay pot! But the water was far down at the bottom."
    - image: "the crow holding a small round pebble in its beak next to a pile of pebbles, clever happy smile, idea sparkle"
      hi: "कौए ने सोचा, और एक तरकीब निकाली। उसने छोटे छोटे कंकड़ उठाए।"
      hinglish: "Kauwe ne socha, aur ek tarkeeb nikaali. Usne chhote chhote kankad uthaaye."
      en: "The clever crow thought hard, and picked up small pebbles."
    - image: "the crow dropping a pebble into the tall brown clay pot, sparkling water rising to the top, splash"
      hi: "एक एक करके उसने कंकड़ घड़े में डाले। पानी ऊपर आने लगा!"
      hinglish: "Ek ek karke usne kankad ghade mein daale. Paani upar aane laga!"
      en: "One by one, he dropped the pebbles in. The water came up, up, up!"
    - image: "the crow happily drinking water from the tall brown clay pot, joyful, colourful flowers and butterflies around, golden sunshine"
      hi: "कौए ने जी भर के पानी पिया। सीख: हिम्मत और समझदारी से हर मुश्किल आसान है!"
      hinglish: "Kauwe ne ji bhar ke paani piya. Seekh: himmat aur samajhdaari se har mushkil aasaan hai!"
      en: "The crow drank happily. Moral: think smart and never give up!"

- id: 2
  title_hi: "चालाक लोमड़ी और अंगूर"
  title_hinglish: "Chaalaak Lomdi aur Angoor"
  title_en: "The Fox and the Grapes"
  character: "a small cute orange fox cub with big green eyes and a fluffy white-tipped tail"
  moral_hi: "जो चीज़ न मिले, उसे बुरा मत कहो।"
  moral_hinglish: "Jo cheez na mile, use bura mat kaho."
  moral_en: "Don't call something bad just because you can't have it."
  tags: ["fox story", "aesop", "moral story"]
  scenes:
    - image: "the fox cub walking happily through a sunny green forest path, butterflies around"
      hi: "एक दिन एक छोटी लोमड़ी जंगल में घूम रही थी।"
      hinglish: "Ek din ek chhoti lomdi jungle mein ghoom rahi thi."
      en: "One sunny day, a little fox was walking in the forest."
    - image: "the fox cub looking up at a bunch of juicy purple grapes hanging high on a vine, eyes shining"
      hi: "उसने ऊपर बेल पर मीठे, रसीले अंगूर लटकते देखे। उसके मुँह में पानी आ गया।"
      hinglish: "Usne upar bel par meethe, raseele angoor latakte dekhe. Uske munh mein paani aa gaya."
      en: "She saw sweet, juicy grapes hanging high on a vine. Her mouth started watering!"
    - image: "the fox cub jumping up high toward the grapes, paws stretched, grapes just out of reach"
      hi: "लोमड़ी ने ज़ोर से छलांग लगाई, पर अंगूर बहुत ऊँचे थे।"
      hinglish: "Lomdi ne zor se chhalaang lagaayi, par angoor bahut oonche the."
      en: "She jumped up high with all her might, but the grapes were too high."
    - image: "the fox cub jumping again and again, tired and panting, sunny afternoon"
      hi: "उसने बार बार कोशिश की, पर अंगूर तक नहीं पहुँच पाई। वह थक गई।"
      hinglish: "Usne baar baar koshish ki, par angoor tak nahin pahunch paayi. Woh thak gayi."
      en: "She tried again and again, but she could not reach them. She got very tired."
    - image: "the fox cub walking away with her nose in the air and a grumpy face, grapes behind her"
      hi: "लोमड़ी मुँह बनाकर बोली, 'हुंह! ये अंगूर तो खट्टे हैं!'"
      hinglish: "Lomdi munh banaakar boli, 'Hunh! Ye angoor toh khatte hain!'"
      en: "The fox made a face and said, 'Humph! These grapes are sour anyway!'"
    - image: "the fox cub sitting under a tree thinking, a wise old grey owl with round glasses smiling from a branch"
      hi: "बच्चों, जो चीज़ न मिले, उसे बुरा मत कहो। फिर से कोशिश करो!"
      hinglish: "Bachchon, jo cheez na mile, use bura mat kaho. Phir se koshish karo!"
      en: "Children, don't call something bad just because you can't have it. Try again instead!"

- id: 3
  title_hi: "शेर और चूहा"
  title_hinglish: "Sher aur Chooha"
  title_en: "The Lion and the Mouse"
  character: "a tiny cute grey mouse with big pink ears, shiny black eyes and a little red scarf"
  moral_hi: "किसी को छोटा मत समझो।"
  moral_hinglish: "Kisi ko chhota mat samjho."
  moral_en: "Never think anyone is too small to help."
  tags: ["lion and mouse", "aesop", "moral story"]
  scenes:
    - image: "a big friendly golden lion with a fluffy brown mane sleeping under a big tree, the mouse playing on his back, sunny jungle"
      hi: "जंगल में एक बड़ा शेर सो रहा था। एक छोटा चूहा उसकी पीठ पर खेलने लगा।"
      hinglish: "Jungle mein ek bada sher so raha tha. Ek chhota chooha uski peeth par khelne laga."
      en: "A big lion was sleeping. A tiny mouse began playing on his back."
    - image: "the big golden lion with a fluffy brown mane waking up and gently holding the mouse in his paw, the mouse looking shy"
      hi: "शेर जाग गया और उसने चूहे को पकड़ लिया।"
      hinglish: "Sher jaag gaya aur usne choohe ko pakad liya."
      en: "The lion woke up and caught the little mouse in his big paw."
    - image: "the mouse folding tiny hands and pleading, the big golden lion smiling and letting him go"
      hi: "चूहा बोला, 'मुझे छोड़ दो, मैं भी कभी आपकी मदद करूँगा।' शेर हँसा और उसे छोड़ दिया।"
      hinglish: "Chooha bola, 'Mujhe chhod do, main bhi kabhi aapki madad karoonga.' Sher hansa aur use chhod diya."
      en: "'Let me go, I'll help you one day,' said the mouse. The lion laughed and let him go."
    - image: "the big golden lion with a fluffy brown mane caught in a rope net in the jungle, looking sad, evening light"
      hi: "कुछ दिन बाद शेर एक जाल में फँस गया।"
      hinglish: "Kuch din baad sher ek jaal mein phans gaya."
      en: "A few days later, the lion got stuck in a big rope net."
    - image: "the mouse happily nibbling the ropes of the net, the big golden lion stepping out free and smiling"
      hi: "चूहा दौड़कर आया और अपने दाँतों से जाल काट दिया। शेर आज़ाद हो गया!"
      hinglish: "Chooha daudkar aaya aur apne daanton se jaal kaat diya. Sher aazaad ho gaya!"
      en: "The mouse ran over and cut the net with his tiny teeth. The lion was free!"
    - image: "the big golden lion with a fluffy brown mane and the mouse sitting together as best friends, sunset jungle"
      hi: "शेर ने कहा, 'धन्यवाद दोस्त!' बच्चों, किसी को छोटा मत समझो।"
      hinglish: "Sher ne kaha, 'Dhanyavaad dost!' Bachchon, kisi ko chhota mat samjho."
      en: "'Thank you, my friend!' said the lion. Children, never think anyone is too small to help."

- id: 4
  title_hi: "कछुआ और खरगोश"
  title_hinglish: "Kachhua aur Khargosh"
  title_en: "The Tortoise and the Hare"
  character: "a slow cute green tortoise with a shiny brown shell, kind brown eyes and a little blue cap"
  moral_hi: "धीरे धीरे पर लगातार चलने वाला ही जीतता है।"
  moral_hinglish: "Dheere dheere par lagaataar chalne waala hi jeetta hai."
  moral_en: "Slow and steady wins the race."
  tags: ["tortoise and hare", "aesop", "moral story"]
  scenes:
    - image: "a fast white rabbit with long ears and a red bow tie laughing at the tortoise on a forest path, sunny morning"
      hi: "एक खरगोश कछुए पर हँसा, 'तुम कितने धीरे चलते हो!'"
      hinglish: "Ek khargosh kachhue par hansa, 'Tum kitne dheere chalte ho!'"
      en: "A fast rabbit laughed at the tortoise. 'You are so slow!' he said."
    - image: "the tortoise and the fast white rabbit with a red bow tie at a start line made of flowers, forest animals cheering"
      hi: "कछुए ने कहा, 'चलो दौड़ लगाते हैं!' सब जानवर देखने आ गए।"
      hinglish: "Kachhue ne kaha, 'Chalo daud lagaate hain!' Sab jaanvar dekhne aa gaye."
      en: "The tortoise smiled and said, 'Let's have a race!' All the animals came to watch."
    - image: "the fast white rabbit with a red bow tie zooming far ahead on the path, the tortoise walking slowly behind"
      hi: "खरगोश तेज़ी से भागा और बहुत आगे निकल गया।"
      hinglish: "Khargosh tezi se bhaaga aur bahut aage nikal gaya."
      en: "The rabbit ran super fast and went far, far ahead."
    - image: "the fast white rabbit with a red bow tie sleeping under a shady tree with a big smile, butterflies around"
      hi: "उसने सोचा, 'थोड़ा आराम कर लूँ।' और वह पेड़ के नीचे सो गया।"
      hinglish: "Usne socha, 'Thoda aaraam kar loon.' Aur woh ped ke neeche so gaya."
      en: "He thought, 'I have lots of time. Let me rest.' And he fell fast asleep."
    - image: "the tortoise slowly and happily crossing a flower finish line, forest animals clapping"
      hi: "कछुआ धीरे धीरे चलता रहा, बिना रुके, और दौड़ जीत गया!"
      hinglish: "Kachhua dheere dheere chalta raha, bina ruke, aur daud jeet gaya!"
      en: "The tortoise kept walking, slowly and steadily, without stopping. He won the race!"
    - image: "the fast white rabbit with a red bow tie waking up surprised, the tortoise holding a small golden trophy, cheerful forest"
      hi: "खरगोश हैरान रह गया। बच्चों, धीरे धीरे पर लगातार चलने वाला ही जीतता है।"
      hinglish: "Khargosh hairaan reh gaya. Bachchon, dheere dheere par lagaataar chalne waala hi jeetta hai."
      en: "The rabbit woke up, surprised. Children, slow and steady wins the race!"

- id: 5
  title_hi: "बंदर और मगरमच्छ"
  title_hinglish: "Bandar aur Magarmachh"
  title_en: "The Monkey and the Crocodile"
  character: "a cheerful little brown monkey with a long curly tail, bright eyes and a yellow vest"
  moral_hi: "मुश्किल में घबराओ मत, दिमाग़ से काम लो।"
  moral_hinglish: "Mushkil mein ghabraao mat, dimaag se kaam lo."
  moral_en: "In trouble, stay calm and think smart."
  tags: ["monkey and crocodile", "panchatantra", "moral story"]
  scenes:
    - image: "the monkey sitting on a big jamun tree by a sparkling river, eating purple jamuns"
      hi: "नदी किनारे जामुन के पेड़ पर एक बंदर रहता था।"
      hinglish: "Nadi kinaare jaamun ke ped par ek bandar rehta tha."
      en: "A happy monkey lived on a jamun tree by the river."
    - image: "the monkey dropping jamuns to a big green crocodile with a toothy grin and a striped bandana in the river"
      hi: "वह रोज़ अपने दोस्त मगरमच्छ को मीठे जामुन खिलाता था।"
      hinglish: "Woh roz apne dost magarmachh ko meethe jaamun khilaata tha."
      en: "Every day, he gave sweet jamuns to his friend, the crocodile."
    - image: "the big green crocodile with a striped bandana swimming with the monkey sitting on his back in the middle of the river"
      hi: "एक दिन मगरमच्छ बोला, 'मेरे घर चलो।' बंदर उसकी पीठ पर बैठ गया।"
      hinglish: "Ek din magarmachh bola, 'Mere ghar chalo.' Bandar uski peeth par baith gaya."
      en: "One day the crocodile said, 'Come to my home.' The monkey sat on his back."
    - image: "the big green crocodile with a striped bandana with a sly smile, the monkey looking surprised on his back"
      hi: "बीच नदी में मगरमच्छ बोला, 'मेरी पत्नी को तुम्हारा दिल खाना है!'"
      hinglish: "Beech nadi mein magarmachh bola, 'Meri patni ko tumhaara dil khaana hai!'"
      en: "In the middle of the river he said, 'My wife wants to eat your heart!'"
    - image: "the monkey pointing back toward the jamun tree with a clever smile, riding on the crocodile"
      hi: "बंदर चतुराई से बोला, 'अरे, मेरा दिल तो पेड़ पर रखा है! वापस चलो।'"
      hinglish: "Bandar chaturaai se bola, 'Arre, mera dil toh ped par rakha hai! Waapas chalo.'"
      en: "The clever monkey said, 'Oh no, I left my heart on the tree! Let's go back.'"
    - image: "the monkey safe high up in the jamun tree laughing, the big green crocodile with a striped bandana looking silly in the water"
      hi: "किनारे पहुँचते ही बंदर पेड़ पर चढ़ गया। बच्चों, मुश्किल में दिमाग़ से काम लो।"
      hinglish: "Kinaare pahunchte hi bandar ped par chadh gaya. Bachchon, mushkil mein dimaag se kaam lo."
      en: "At the shore, he jumped up the tree, safe! Children, in trouble, stay calm and think smart."

- id: 6
  title_hi: "चींटी और टिड्डा"
  title_hinglish: "Cheenti aur Tidda"
  title_en: "The Ant and the Grasshopper"
  character: "a hardworking little red ant with big shiny eyes and a tiny green leaf backpack"
  moral_hi: "आज मेहनत करो, तो कल आराम मिलेगा।"
  moral_hinglish: "Aaj mehnat karo, toh kal aaraam milega."
  moral_en: "Work hard today, and you will be happy tomorrow."
  tags: ["ant and grasshopper", "aesop", "moral story"]
  scenes:
    - image: "the ant carrying a grain of wheat across a sunny summer meadow"
      hi: "गर्मी के दिन थे। एक छोटी चींटी दाने इकट्ठा कर रही थी।"
      hinglish: "Garmi ke din the. Ek chhoti cheenti daane ikattha kar rahi thi."
      en: "It was a hot summer day. A little ant was collecting grains of food."
    - image: "a happy green grasshopper with a tiny guitar singing and dancing on a flower, the ant working in the background"
      hi: "एक टिड्डा दिन भर गाना गाता और नाचता रहता था।"
      hinglish: "Ek tidda din bhar gaana gaata aur naachta rehta tha."
      en: "A grasshopper was singing songs and dancing all day long."
    - image: "the happy green grasshopper with a tiny guitar laughing, the ant carrying food to her anthill"
      hi: "टिड्डा हँसा, 'इतनी मेहनत क्यों? आओ, मेरे साथ खेलो!'"
      hinglish: "Tidda hansa, 'Itni mehnat kyon? Aao, mere saath khelo!'"
      en: "The grasshopper laughed, 'Why work so hard? Come and play with me!'"
    - image: "the ant shaking her head politely and storing grains inside a cosy anthill"
      hi: "चींटी बोली, 'सर्दी आने वाली है, मुझे खाना जमा करना है।'"
      hinglish: "Cheenti boli, 'Sardi aane waali hai, mujhe khaana jama karna hai.'"
      en: "The ant said, 'Winter is coming. I must store food now.'"
    - image: "snowy winter scene, the green grasshopper with a tiny guitar shivering and hungry, knocking at the anthill door"
      hi: "सर्दी आई। टिड्डे के पास खाना नहीं था। वह ठंड से काँप रहा था।"
      hinglish: "Sardi aayi. Tidde ke paas khaana nahin tha. Woh thand se kaanp raha tha."
      en: "Soon winter came. The grasshopper had no food, and he was shivering in the cold."
    - image: "the ant sharing food with the green grasshopper inside a warm cosy anthill, both smiling"
      hi: "चींटी ने उसे खाना दिया। बच्चों, आज मेहनत करो, तो कल आराम मिलेगा।"
      hinglish: "Cheenti ne use khaana diya. Bachchon, aaj mehnat karo, toh kal aaraam milega."
      en: "The kind ant shared her food. Children, work hard today, and you'll be happy tomorrow."

- id: 7
  title_hi: "बीरबल और कौवों की गिनती"
  title_hinglish: "Birbal aur Kauwon ki Ginti"
  title_en: "Birbal Counts the Crows"
  character: "a clever smiling Indian man with a neat moustache, a bright orange turban and a green royal jacket"
  moral_hi: "समझदारी और मुस्कान से हर मुश्किल आसान हो जाती है।"
  moral_hinglish: "Samajhdaari aur muskaan se har mushkil aasaan ho jaati hai."
  moral_en: "A clever mind and a smile make every problem easy."
  tags: ["akbar birbal", "birbal story", "funny story"]
  scenes:
    - image: "a kind king with a white beard, a golden crown and a red royal robe walking with the man in a colourful palace garden, crows on trees"
      hi: "एक दिन राजा अकबर और बीरबल बाग़ में टहल रहे थे।"
      hinglish: "Ek din raja Akbar aur Birbal baagh mein tehel rahe the."
      en: "One day, King Akbar and clever Birbal were walking in the palace garden."
    - image: "the kind king with a white beard and golden crown pointing up at many black crows on trees, looking curious"
      hi: "अकबर ने पूछा, 'बीरबल, बताओ, हमारे शहर में कितने कौवे हैं?'"
      hinglish: "Akbar ne poochha, 'Birbal, batao, hamaare shehar mein kitne kauwe hain?'"
      en: "Akbar pointed at the crows and asked, 'Birbal, how many crows live in our city?'"
    - image: "the man stroking his moustache and thinking with a smile, finger on chin, palace garden"
      hi: "बीरबल ने थोड़ा सोचा और मुस्कुराकर बोला, 'पूरे पचास हज़ार, महाराज!'"
      hinglish: "Birbal ne thoda socha aur muskuraakar bola, 'Poore pachaas hazaar, Maharaj!'"
      en: "Birbal thought for a moment and smiled. 'Exactly fifty thousand, Your Majesty!'"
    - image: "the kind king with a white beard and golden crown raising one eyebrow with a playful look, the man smiling"
      hi: "अकबर बोले, 'अगर कम निकले तो?' बीरबल बोला, 'तो कुछ कौवे घूमने गए होंगे!'"
      hinglish: "Akbar bole, 'Agar kam nikle toh?' Birbal bola, 'Toh kuch kauwe ghoomne gaye honge!'"
      en: "'What if there are fewer?' asked Akbar. 'Then some crows went on holiday!' said Birbal."
    - image: "the kind king with a white beard and golden crown and the man laughing together, courtiers smiling in a bright palace hall"
      hi: "'और ज़्यादा निकले तो?' 'तो उनके रिश्तेदार मिलने आए होंगे!' अकबर हँस पड़े।"
      hinglish: "'Aur zyaada nikle toh?' 'Toh unke rishtedaar milne aaye honge!' Akbar hans pade."
      en: "'And if there are more?' 'Then their relatives came to visit!' Akbar burst out laughing."
    - image: "the kind king with a white beard and golden crown giving the man a shiny golden necklace in a bright palace hall"
      hi: "बच्चों, मुश्किल सवाल का जवाब भी समझदारी और मुस्कान से दो।"
      hinglish: "Bachchon, mushkil sawaal ka jawaab bhi samajhdaari aur muskaan se do."
      en: "Children, even a tricky question can be answered with a clever mind and a big smile."

- id: 8
  title_hi: "लालची कुत्ता"
  title_hinglish: "Laalchi Kutta"
  title_en: "The Greedy Dog"
  character: "a chubby brown puppy with floppy ears, big black eyes and a red collar"
  moral_hi: "लालच बुरी बला है।"
  moral_hinglish: "Laalach buri bala hai."
  moral_en: "Being greedy makes us lose what we have."
  tags: ["greedy dog", "aesop", "moral story"]
  scenes:
    - image: "the puppy happily trotting through a village street holding a big bone in his mouth"
      hi: "एक कुत्ते को एक बड़ी सी हड्डी मिली। वह बहुत ख़ुश हुआ।"
      hinglish: "Ek kutte ko ek badi si haddi mili. Woh bahut khush hua."
      en: "A little dog found a big, tasty bone. He was so happy!"
    - image: "the puppy walking on a small wooden bridge over a clear blue stream, bone in mouth"
      hi: "वह हड्डी लेकर नदी के छोटे पुल पर चल रहा था।"
      hinglish: "Woh haddi lekar nadi ke chhote pul par chal raha tha."
      en: "He carried the bone and walked across a small bridge over a river."
    - image: "the puppy looking down at his own reflection in the water, surprised"
      hi: "पानी में उसे दूसरा कुत्ता दिखा, जिसके मुँह में भी हड्डी थी।"
      hinglish: "Paani mein use doosra kutta dikha, jiske munh mein bhi haddi thi."
      en: "In the water, he saw another dog with another bone in its mouth."
    - image: "the puppy with a greedy look and narrowed eyes, his reflection in the water below"
      hi: "उसने सोचा, 'मुझे वो हड्डी भी चाहिए! फिर मेरे पास दो हड्डियाँ होंगी।'"
      hinglish: "Usne socha, 'Mujhe woh haddi bhi chahiye! Phir mere paas do haddiyaan hongi.'"
      en: "He thought, 'I want that bone too! Then I'll have two bones!'"
    - image: "the puppy barking at the water, the bone falling with a big splash"
      hi: "जैसे ही वह भौंका, उसकी हड्डी पानी में गिर गई। छपाक!"
      hinglish: "Jaise hi woh bhaunka, uski haddi paani mein gir gayi. Chhapaak!"
      en: "He opened his mouth to bark. Splash! His own bone fell into the river."
    - image: "the puppy sitting sadly on the bridge looking at the ripples in the water"
      hi: "वहाँ कोई कुत्ता नहीं था, बस उसकी परछाई थी। बच्चों, लालच बुरी बला है।"
      hinglish: "Wahaan koi kutta nahin tha, bas uski parchhaai thi. Bachchon, laalach buri bala hai."
      en: "There was no other dog, only his reflection. Children, being greedy makes us lose what we have."

- id: 9
  title_hi: "झूठा चरवाहा"
  title_hinglish: "Jhootha Charwaaha"
  title_en: "The Boy Who Cried Wolf"
  character: "a little Indian shepherd boy with curly black hair, a big smile and a red kurta, holding a small stick"
  moral_hi: "कभी झूठ मत बोलो, वरना कोई यक़ीन नहीं करेगा।"
  moral_hinglish: "Kabhi jhooth mat bolo, warna koi yakeen nahin karega."
  moral_en: "Never tell lies, or no one will believe you."
  tags: ["boy who cried wolf", "aesop", "honesty story"]
  scenes:
    - image: "the boy sitting on a green hill with fluffy white sheep, looking bored, sunny day"
      hi: "एक लड़का पहाड़ी पर भेड़ें चराता था। वह बहुत बोर हो रहा था।"
      hinglish: "Ek ladka pahaadi par bhedein charaata tha. Woh bahut bore ho raha tha."
      en: "A boy looked after sheep on a green hill. He was feeling very bored."
    - image: "the boy shouting with hands around his mouth, playful cheeky look, fluffy white sheep around"
      hi: "उसने मज़ाक में चिल्लाया, 'भेड़िया आया! बचाओ!'"
      hinglish: "Usne mazaak mein chillaaya, 'Bhediya aaya! Bachaao!'"
      en: "Just for fun, he shouted, 'Wolf! Wolf! Please help me!'"
    - image: "village people running up the hill, the boy laughing and holding his tummy"
      hi: "गाँव वाले दौड़कर आए। पर वहाँ कोई भेड़िया नहीं था। लड़का हँसने लगा।"
      hinglish: "Gaon waale daudkar aaye. Par wahaan koi bhediya nahin tha. Ladka hansne laga."
      en: "The villagers came running up the hill. But there was no wolf. The boy laughed."
    - image: "village people walking back down the hill looking annoyed, the boy giggling"
      hi: "उसने फिर ऐसा ही किया। गाँव वाले नाराज़ होकर लौट गए।"
      hinglish: "Usne phir aisa hi kiya. Gaon waale naraaz hokar laut gaye."
      en: "He played the same trick again. The villagers went back home, very upset."
    - image: "a grumpy grey wolf peeking from bushes, fluffy white sheep running, the boy shouting worried"
      hi: "फिर सच में भेड़िया आया! लड़का चिल्लाया, पर इस बार कोई नहीं आया।"
      hinglish: "Phir sach mein bhediya aaya! Ladka chillaaya, par is baar koi nahin aaya."
      en: "Then a real wolf came! The boy shouted, but this time nobody came."
    - image: "the boy sitting sad and sorry on the hill at evening, a few fluffy white sheep hiding behind him"
      hi: "भेड़ें डरकर भाग गईं। बच्चों, कभी झूठ मत बोलो, वरना कोई यक़ीन नहीं करेगा।"
      hinglish: "Bhedein darkar bhaag gayin. Bachchon, kabhi jhooth mat bolo, warna koi yakeen nahin karega."
      en: "His sheep ran away. Children, never tell lies, or no one will believe you."

- id: 10
  title_hi: "बातूनी कछुआ"
  title_hinglish: "Baatooni Kachhua"
  title_en: "The Talkative Tortoise"
  character: "a chatty little green tortoise with a round brown shell, big happy eyes and a pink flower on her shell"
  moral_hi: "सोचकर बोलो, और ज़रूरत हो तो चुप रहो।"
  moral_hinglish: "Sochkar bolo, aur zaroorat ho toh chup raho."
  moral_en: "Think before you speak, and learn to stay quiet when it matters."
  tags: ["talkative tortoise", "jataka", "panchatantra"]
  scenes:
    - image: "the tortoise talking happily by a pond, two white swans with orange beaks listening"
      hi: "एक कछुआ बहुत बातें करता था। उसके दो दोस्त थे, दो हंस।"
      hinglish: "Ek kachhua bahut baatein karta tha. Uske do dost the, do hans."
      en: "A tortoise loved to talk and talk. Her best friends were two swans."
    - image: "a dry cracked pond under hot sun, the tortoise and two white swans with orange beaks looking worried"
      hi: "गर्मी में तालाब सूख गया। हंसों ने कहा, 'चलो, नए तालाब चलते हैं।'"
      hinglish: "Garmi mein taalaab sookh gaya. Hanson ne kaha, 'Chalo, naye taalaab chalte hain.'"
      en: "One summer, the pond dried up. The swans said, 'Let's fly to a new lake.'"
    - image: "two white swans with orange beaks holding a stick in their beaks, the tortoise biting the middle of the stick"
      hi: "हंसों ने एक लकड़ी पकड़ी, कछुए ने बीच से। 'रास्ते में बोलना मत!'"
      hinglish: "Hanson ne ek lakdi pakdi, kachhue ne beech se. 'Raaste mein bolna mat!'"
      en: "The swans held a stick. The tortoise bit the middle. 'Don't talk!' they said."
    - image: "two white swans with orange beaks flying high over a village carrying the tortoise on the stick, children pointing up"
      hi: "वे उड़ चले। नीचे बच्चे चिल्लाए, 'देखो, उड़ता कछुआ!'"
      hinglish: "Woh ud chale. Neeche bachche chillaaye, 'Dekho, udta kachhua!'"
      en: "Up they flew! Children below shouted, 'Look, a flying tortoise!'"
    - image: "the tortoise falling softly into a big pile of soft hay, looking dizzy but okay"
      hi: "कछुआ बोलने लगा, 'मैं...' और धप्प से घास के ढेर पर गिर गया।"
      hinglish: "Kachhua bolne laga, 'Main...' aur dhapp se ghaas ke dher par gir gaya."
      en: "The tortoise opened her mouth to say, 'I...' and plop! She fell onto a pile of hay."
    - image: "the tortoise sitting in the hay with a sheepish smile, two white swans with orange beaks landing beside her"
      hi: "बच्चों, सोचकर बोलो, और ज़रूरत हो तो चुप रहना भी सीखो।"
      hinglish: "Bachchon, sochkar bolo, aur zaroorat ho toh chup rehna bhi seekho."
      en: "Children, always think before you speak, and learn to stay quiet when it matters."

- id: 11
  title_hi: "ईमानदार लकड़हारा"
  title_hinglish: "Imaandaar Lakadhaara"
  title_en: "The Honest Woodcutter"
  character: "a kind Indian woodcutter man with a short black beard, warm eyes and a green turban"
  moral_hi: "हमेशा सच बोलो, ईमानदारी का फल मीठा होता है।"
  moral_hinglish: "Hamesha sach bolo, imaandaari ka phal meetha hota hai."
  moral_en: "Always be honest; honesty is always rewarded."
  tags: ["honest woodcutter", "honesty story", "moral story"]
  scenes:
    - image: "the woodcutter cutting wood with an iron axe near a sparkling river in a sunny forest"
      hi: "एक गरीब लकड़हारा नदी किनारे पेड़ काट रहा था।"
      hinglish: "Ek gareeb lakadhaara nadi kinaare ped kaat raha tha."
      en: "A poor woodcutter was cutting wood near a sparkling river."
    - image: "an iron axe slipping and falling into the river with a splash, the woodcutter shocked"
      hi: "अचानक उसकी लोहे की कुल्हाड़ी नदी में गिर गई। वह रोने लगा।"
      hinglish: "Achaanak uski lohe ki kulhaadi nadi mein gir gayi. Woh rone laga."
      en: "Suddenly, his iron axe slipped and fell into the river. He began to cry."
    - image: "a glowing river fairy with sparkly blue wings rising from the water holding a golden axe, the woodcutter amazed"
      hi: "नदी से एक परी निकली। उसने सोने की कुल्हाड़ी दिखाई। 'क्या यह तुम्हारी है?'"
      hinglish: "Nadi se ek pari nikli. Usne sone ki kulhaadi dikhaayi. 'Kya yeh tumhaari hai?'"
      en: "A fairy rose from the river with a golden axe. 'Is this yours?' she asked."
    - image: "the woodcutter shaking his head, the glowing river fairy with sparkly blue wings holding a silver axe"
      hi: "'नहीं,' लकड़हारा बोला। परी ने चाँदी की कुल्हाड़ी दिखाई। 'नहीं, यह भी नहीं।'"
      hinglish: "'Nahin,' lakadhaara bola. Pari ne chaandi ki kulhaadi dikhaayi. 'Nahin, yeh bhi nahin.'"
      en: "'No,' said the woodcutter. She showed a silver axe. 'No, not this one either.'"
    - image: "the glowing river fairy with sparkly blue wings holding an old iron axe, the woodcutter smiling happily"
      hi: "फिर परी ने लोहे की कुल्हाड़ी दिखाई। 'हाँ, यही मेरी है!'"
      hinglish: "Phir pari ne lohe ki kulhaadi dikhaayi. 'Haan, yahi meri hai!'"
      en: "Then she showed his old iron axe. 'Yes, that one is mine!' he smiled."
    - image: "the glowing river fairy with sparkly blue wings giving gold, silver and iron axes to the joyful woodcutter"
      hi: "परी ने ख़ुश होकर उसे तीनों कुल्हाड़ियाँ दे दीं। बच्चों, हमेशा सच बोलो।"
      hinglish: "Pari ne khush hokar use teenon kulhaadiyaan de deen. Bachchon, hamesha sach bolo."
      en: "The happy fairy gave him all three axes. Children, always be honest."

- id: 12
  title_hi: "हाथी के सच्चे दोस्त"
  title_hinglish: "Haathi ke Sachche Dost"
  title_en: "The Elephant's True Friends"
  character: "a gentle baby elephant with soft grey skin, big kind eyes and a pink flower crown"
  moral_hi: "असली दोस्त वही है जो मुश्किल में साथ दे।"
  moral_hinglish: "Asli dost wahi hai jo mushkil mein saath de."
  moral_en: "A true friend helps in hard times."
  tags: ["elephant story", "friendship", "moral story"]
  scenes:
    - image: "the baby elephant walking alone in a green jungle, looking hopeful"
      hi: "एक छोटा हाथी जंगल में दोस्त ढूँढ रहा था।"
      hinglish: "Ek chhota haathi jungle mein dost dhoondh raha tha."
      en: "A baby elephant was walking in the jungle, looking for friends."
    - image: "the baby elephant smiling up at a small brown monkey with a yellow vest on a tree, the monkey shaking his head"
      hi: "उसने बंदर से पूछा, 'मेरे दोस्त बनोगे?' बंदर बोला, 'तुम तो बहुत बड़े हो!'"
      hinglish: "Usne bandar se poochha, 'Mere dost banoge?' Bandar bola, 'Tum toh bahut bade ho!'"
      en: "He asked a monkey, 'Will you be my friend?' 'You are too big!' said the monkey."
    - image: "the baby elephant talking to a small white bunny with pink ears, the bunny hopping away"
      hi: "खरगोश बोला, 'तुम मेरे घर में नहीं आ पाओगे।' हाथी उदास हो गया।"
      hinglish: "Khargosh bola, 'Tum mere ghar mein nahin aa paoge.' Haathi udaas ho gaya."
      en: "A bunny said, 'You can't fit in my little home.' The elephant felt sad."
    - image: "the small brown monkey with a yellow vest and the small white bunny with pink ears stuck in a muddy pond, calling for help"
      hi: "अगले दिन बंदर और खरगोश कीचड़ में फँस गए। 'बचाओ!'"
      hinglish: "Agle din bandar aur khargosh keechad mein phans gaye. 'Bachaao!'"
      en: "The next day, the monkey and the bunny got stuck in deep mud. 'Help!'"
    - image: "the baby elephant pulling the small brown monkey and the small white bunny out of the mud with his trunk"
      hi: "हाथी ने अपनी सूँड से दोनों को बाहर निकाल लिया।"
      hinglish: "Haathi ne apni soond se donon ko baahar nikaal liya."
      en: "The elephant used his long trunk and pulled them both out."
    - image: "the small brown monkey with a yellow vest and the small white bunny hugging the baby elephant, rainbow in the sky"
      hi: "सब बोले, 'तुम सबसे अच्छे दोस्त हो!' बच्चों, असली दोस्त मुश्किल में साथ देता है।"
      hinglish: "Sab bole, 'Tum sabse achchhe dost ho!' Bachchon, asli dost mushkil mein saath deta hai."
      en: "'You are the best friend ever!' they cheered. Children, a true friend helps in hard times."

- id: 13
  title_hi: "चिंटू के चमकते दाँत"
  title_hinglish: "Chintu ke Chamakte Daant"
  title_en: "Chintu's Shiny Teeth"
  character: "a cute white bunny with long pink ears, sparkly blue eyes and striped green pyjamas"
  moral_hi: "रोज़ सुबह और रात को ब्रश करो।"
  moral_hinglish: "Roz subah aur raat ko brush karo."
  moral_en: "Brush your teeth every morning and every night."
  tags: ["brushing teeth", "good habits", "bunny story"]
  scenes:
    - image: "the bunny munching a big pile of colourful sweets and toffees, giggling, cosy living room"
      hi: "चिंटू खरगोश को मिठाई बहुत पसंद थी। वह रोज़ ढेर सारी टॉफ़ी खाता था।"
      hinglish: "Chintu khargosh ko mithaai bahut pasand thi. Woh roz dher saari toffee khaata tha."
      en: "Chintu the bunny loved sweets. He ate lots and lots of toffees every day."
    - image: "the bunny yawning and jumping into bed at night, a toothbrush lying unused by the sink"
      hi: "पर रात को वह ब्रश किए बिना ही सो जाता था।"
      hinglish: "Par raat ko woh brush kiye bina hi so jaata tha."
      en: "But at night, he went to bed without brushing his teeth."
    - image: "the bunny holding his cheek with a sad face in a sunny morning bedroom"
      hi: "एक सुबह उसके दाँत में बहुत दर्द हुआ। 'आह! मम्मी!'"
      hinglish: "Ek subah uske daant mein bahut dard hua. 'Aah! Mummy!'"
      en: "One morning, his tooth hurt a lot. 'Ouch! Mummy!' he cried."
    - image: "a kind mother rabbit with a purple apron showing the bunny a toothbrush, gently explaining"
      hi: "मम्मी बोलीं, 'मीठे से दाँतों में कीड़े लगते हैं। सुबह और रात ब्रश करो।'"
      hinglish: "Mummy boleen, 'Meethe se daanton mein keede lagte hain. Subah aur raat brush karo.'"
      en: "Mummy said, 'Sweets make germs on teeth. Brush in the morning and at night.'"
    - image: "the bunny brushing his teeth with lots of foam and a big smile, bathroom with bubbles"
      hi: "अब चिंटू रोज़ दो बार गोल गोल ब्रश करता है।"
      hinglish: "Ab Chintu roz do baar gol gol brush karta hai."
      en: "Now Chintu brushes round and round, two times every day."
    - image: "the bunny showing a big sparkling white smile, little stars twinkling around his teeth, the kind mother rabbit with a purple apron clapping"
      hi: "उसके दाँत चमकने लगे! बच्चों, रोज़ सुबह और रात को ब्रश करो।"
      hinglish: "Uske daant chamakne lage! Bachchon, roz subah aur raat ko brush karo."
      en: "His teeth are shiny and strong! Children, brush your teeth every morning and every night."

- id: 14
  title_hi: "परी का सॉरी"
  title_hinglish: "Pari ka Sorry"
  title_en: "Pari Says Sorry"
  character: "a cheerful little Indian girl with two pigtails, big brown eyes and a yellow frock"
  moral_hi: "ग़लती हो तो दिल से सॉरी बोलो।"
  moral_hinglish: "Galti ho toh dil se sorry bolo."
  moral_en: "When you make a mistake, say sorry from your heart."
  tags: ["saying sorry", "good manners", "kids story"]
  scenes:
    - image: "the girl and a little Indian boy with spiky hair and a blue t-shirt playing with a red toy car in a sunny park"
      hi: "परी और राजू पार्क में राजू की लाल गाड़ी से खेल रहे थे।"
      hinglish: "Pari aur Raju park mein Raju ki laal gaadi se khel rahe the."
      en: "Pari and Raju were playing with Raju's red toy car in the park."
    - image: "the girl pushing the red toy car fast, the car hitting a stone and a wheel popping off"
      hi: "परी ने गाड़ी तेज़ी से चलाई। टक! उसका एक पहिया टूट गया।"
      hinglish: "Pari ne gaadi tezi se chalaayi. Tak! Uska ek pahiya toot gaya."
      en: "Pari pushed the car too fast. Bump! One wheel broke off."
    - image: "the little Indian boy with spiky hair and a blue t-shirt looking sad with teary eyes, holding the broken toy car"
      hi: "राजू उदास हो गया। उसकी आँखों में आँसू आ गए।"
      hinglish: "Raju udaas ho gaya. Uski aankhon mein aansoo aa gaye."
      en: "Raju felt very sad. Tears filled his eyes."
    - image: "the girl feeling guilty, standing behind a tree, thinking with a worried face"
      hi: "परी को बुरा लगा। उसने सोचा, 'मुझे क्या करना चाहिए?'"
      hinglish: "Pari ko bura laga. Usne socha, 'Mujhe kya karna chahiye?'"
      en: "Pari felt bad inside. She thought, 'What should I do now?'"
    - image: "the girl holding the hand of the little boy with spiky hair and a blue t-shirt, both fixing the toy car wheel together"
      hi: "उसने कहा, 'सॉरी राजू, ग़लती मेरी थी।' दोनों ने मिलकर पहिया लगाया।"
      hinglish: "Usne kaha, 'Sorry Raju, galti meri thi.' Donon ne milkar pahiya lagaaya."
      en: "She said, 'I'm sorry, Raju. It was my mistake.' Together, they fixed the wheel."
    - image: "the girl and the little boy with spiky hair and a blue t-shirt laughing and playing again, sunny park with balloons"
      hi: "राजू मुस्कुराया। बच्चों, ग़लती हो तो दिल से सॉरी बोलो।"
      hinglish: "Raju muskuraaya. Bachchon, galti ho toh dil se sorry bolo."
      en: "Raju smiled again. Children, when you make a mistake, say sorry from your heart."

- id: 15
  title_hi: "गोलू और पानी की बूँदें"
  title_hinglish: "Golu aur Paani ki Boondein"
  title_en: "Golu Saves Water"
  character: "a little Indian boy with chubby cheeks, short black hair and a green t-shirt"
  moral_hi: "पानी बचाओ, जीवन बचाओ।"
  moral_hinglish: "Paani bachaao, jeevan bachaao."
  moral_en: "Save water, it is life."
  tags: ["save water", "good habits", "kids story"]
  scenes:
    - image: "the boy brushing his teeth with the tap running full, water splashing, bright bathroom"
      hi: "गोलू ब्रश करते समय नल खुला छोड़ देता था। पानी बहता रहता था।"
      hinglish: "Golu brush karte samay nal khula chhod deta tha. Paani behta rehta tha."
      en: "Golu always left the tap running while he brushed his teeth."
    - image: "a kind grandmother with grey hair in a bun and a purple saree watching from the bathroom door, the boy brushing"
      hi: "दादी ने देखा और बोलीं, 'गोलू, पानी बहुत क़ीमती है।'"
      hinglish: "Daadi ne dekha aur boleen, 'Golu, paani bahut keemti hai.'"
      en: "Grandma saw it and said, 'Golu, water is very precious.'"
    - image: "the kind grandmother with grey hair in a bun and a purple saree showing the boy a picture book of a dry land with thirsty animals"
      hi: "'कई जगह लोगों और जानवरों को पीने का पानी भी नहीं मिलता।'"
      hinglish: "'Kai jagah logon aur jaanvaron ko peene ka paani bhi nahin milta.'"
      en: "'In many places, people and animals don't even have water to drink.'"
    - image: "the boy looking thoughtful and surprised, hand on his cheek"
      hi: "गोलू ने सोचा, 'अरे! मैं तो रोज़ इतना पानी बहा देता हूँ।'"
      hinglish: "Golu ne socha, 'Arre! Main toh roz itna paani baha deta hoon.'"
      en: "Golu thought, 'Oh no! I waste so much water every day.'"
    - image: "the boy turning off the tap and brushing with a small mug of water, smiling"
      hi: "अब गोलू नल बंद करके, मग में पानी लेकर ब्रश करता है।"
      hinglish: "Ab Golu nal band karke, mug mein paani lekar brush karta hai."
      en: "Now Golu turns off the tap and uses a small mug of water."
    - image: "the boy watering a little plant in a sunny garden, the kind grandmother with grey hair in a bun and a purple saree clapping"
      hi: "बचा पानी वह पौधों में डालता है। बच्चों, पानी बचाओ, जीवन बचाओ!"
      hinglish: "Bacha paani woh paudhon mein daalta hai. Bachchon, paani bachaao, jeevan bachaao!"
      en: "He gives the extra water to the plants. Children, save water, it is life!"

- id: 16
  title_hi: "बहादुर मिनी"
  title_hinglish: "Bahaadur Mini"
  title_en: "Brave Little Mini"
  character: "a fluffy little white kitten with big blue eyes and a pink bell collar"
  moral_hi: "हिम्मत करो, डर भाग जाएगा।"
  moral_hinglish: "Himmat karo, dar bhaag jaayega."
  moral_en: "Be brave, and your fear will run away."
  tags: ["being brave", "kitten story", "bedtime story"]
  scenes:
    - image: "the kitten peeking out from under a blanket in a dark cosy bedroom at night, eyes wide"
      hi: "मिनी बिल्ली को अँधेरे से बहुत डर लगता था।"
      hinglish: "Mini billi ko andhere se bahut dar lagta tha."
      en: "Mini the kitten was very scared of the dark."
    - image: "a big funny shadow on the bedroom wall, the kitten trembling under the blanket"
      hi: "रात को दीवार पर एक बड़ी परछाई दिखी। 'मम्मी, भूत!'"
      hinglish: "Raat ko deewaar par ek badi parchhaai dikhi. 'Mummy, bhoot!'"
      en: "At night, she saw a big shadow on the wall. 'Mummy, a monster!'"
    - image: "a friendly glowing firefly with a tiny smile flying near the kitten, soft yellow light"
      hi: "तभी एक जुगनू आया। 'डरो मत, चलो देखते हैं वो क्या है।'"
      hinglish: "Tabhi ek jugnu aaya. 'Daro mat, chalo dekhte hain woh kya hai.'"
      en: "Just then, a glowing firefly came. 'Don't worry! Let's go and see what it is.'"
    - image: "the kitten slowly tiptoeing toward the shadow, the friendly glowing firefly lighting the way"
      hi: "मिनी ने हिम्मत की और धीरे धीरे आगे बढ़ी।"
      hinglish: "Mini ne himmat ki aur dheere dheere aage badhi."
      en: "Mini took a deep breath and bravely walked forward, step by step."
    - image: "the kitten giggling next to a coat stand with a big hat on it, the friendly glowing firefly smiling"
      hi: "अरे! वो तो बस टोपी वाला खूँटा था! मिनी ज़ोर से हँस पड़ी।"
      hinglish: "Arre! Woh toh bas topi waala khoonta tha! Mini zor se hans padi."
      en: "Oh! It was just a coat stand with a hat on it! Mini giggled."
    - image: "the kitten sleeping peacefully with a smile, moonlight through the window, the friendly glowing firefly nearby"
      hi: "अब मिनी को डर नहीं लगता। बच्चों, हिम्मत करो, डर भाग जाएगा।"
      hinglish: "Ab Mini ko dar nahin lagta. Bachchon, himmat karo, dar bhaag jaayega."
      en: "Now Mini is not scared anymore. Children, be brave, and your fear will run away."

- id: 17
  title_hi: "चीकू के मीठे आम"
  title_hinglish: "Cheeku ke Meethe Aam"
  title_en: "Cheeku Shares Mangoes"
  character: "a cute little brown squirrel with a big bushy tail, sparkling eyes and a red bow"
  moral_hi: "बाँटने से ख़ुशी दोगुनी होती है।"
  moral_hinglish: "Baantne se khushi doguni hoti hai."
  moral_en: "Sharing makes happiness double."
  tags: ["sharing", "squirrel story", "moral story"]
  scenes:
    - image: "the squirrel finding a big basket of ripe yellow mangoes under a tree, excited"
      hi: "एक दिन चीकू गिलहरी को आम से भरी एक बड़ी टोकरी मिली।"
      hinglish: "Ek din Cheeku gilahri ko aam se bhari ek badi tokri mili."
      en: "Cheeku the squirrel found a basket full of sweet yellow mangoes."
    - image: "the squirrel hugging the mango basket tightly, a small blue bird with a yellow beak watching from a branch"
      hi: "उसने सोचा, 'ये सारे आम मैं अकेले खाऊँगी!'"
      hinglish: "Usne socha, 'Ye saare aam main akele khaaoongi!'"
      en: "She thought, 'I will eat all these mangoes by myself!'"
    - image: "the squirrel eating a mango alone, looking a bit lonely, friends playing far away"
      hi: "वह अकेले खाने लगी, पर उसे मज़ा नहीं आया। सब दोस्त दूर थे।"
      hinglish: "Woh akele khaane lagi, par use maza nahin aaya. Sab dost door the."
      en: "She started eating alone, but it was not fun. Her friends were far away."
    - image: "the squirrel looking at the small blue bird with a yellow beak and a little white rabbit, both looking hungry"
      hi: "उसने भूखी चिड़िया और खरगोश को देखा। उसका दिल पिघल गया।"
      hinglish: "Usne bhookhi chidiya aur khargosh ko dekha. Uska dil pighal gaya."
      en: "She saw a hungry bird and a little rabbit nearby. Her heart felt soft."
    - image: "the squirrel giving mangoes to the small blue bird with a yellow beak and the little white rabbit, picnic under a tree"
      hi: "चीकू ने सबको आम बाँटे। सब मिलकर खाने लगे।"
      hinglish: "Cheeku ne sabko aam baante. Sab milkar khaane lage."
      en: "Cheeku shared the mangoes with everyone. They ate together under the tree."
    - image: "the squirrel, the small blue bird and the little white rabbit laughing with mango juice on their faces, sunny afternoon"
      hi: "हँसी मज़ाक में आम और भी मीठे लगे! बच्चों, बाँटने से ख़ुशी दोगुनी होती है।"
      hinglish: "Hansi mazaak mein aam aur bhi meethe lage! Bachchon, baantne se khushi doguni hoti hai."
      en: "With laughter, the mangoes tasted even sweeter! Children, sharing makes happiness double."

- id: 18
  title_hi: "चूँचूँ की बारी"
  title_hinglish: "Choonchoon ki Baari"
  title_en: "Choonchoon Waits His Turn"
  character: "a fluffy little yellow chick with tiny orange feet, round black eyes and a blue hair clip"
  moral_hi: "सब्र रखो, अपनी बारी का इंतज़ार करो।"
  moral_hinglish: "Sabr rakho, apni baari ka intezaar karo."
  moral_en: "Be patient and wait for your turn."
  tags: ["patience", "chick story", "good manners"]
  scenes:
    - image: "a colourful swing in a farm playground, the chick running toward it excitedly, sunny morning"
      hi: "चूँचूँ चूज़ा ख़ुशी ख़ुशी झूला झूलने दौड़ा।"
      hinglish: "Choonchoon choosa khushi khushi jhoola jhoolne dauda."
      en: "Choonchoon the chick ran happily to the swing."
    - image: "a little white duckling with a red cap on the swing, a little pink piglet with a green bow waiting in line"
      hi: "पर झूले पर बतख थी, और लाइन में सुअर का बच्चा खड़ा था।"
      hinglish: "Par jhoole par batakh thi, aur line mein suar ka bachcha khada tha."
      en: "But the duckling was on the swing, and the piglet was waiting in line."
    - image: "the chick stomping his tiny feet and pouting, impatient"
      hi: "चूँचूँ बोला, 'मुझे अभी झूलना है!' और पैर पटकने लगा।"
      hinglish: "Choonchoon bola, 'Mujhe abhi jhoolna hai!' Aur pair patakne laga."
      en: "'I want the swing right now!' said Choonchoon, stamping his tiny feet."
    - image: "the little pink piglet with a green bow smiling and kindly pointing to the end of the line"
      hi: "सुअर ने प्यार से कहा, 'थोड़ा रुको, सबकी बारी आएगी।'"
      hinglish: "Suar ne pyaar se kaha, 'Thoda ruko, sabki baari aayegi.'"
      en: "The piglet said kindly, 'Please wait a little. Everyone will get a turn.'"
    - image: "the chick waiting patiently in line, watching the little white duckling with a red cap swinging"
      hi: "चूँचूँ ने गहरी साँस ली और चुपचाप अपनी बारी का इंतज़ार किया।"
      hinglish: "Choonchoon ne gehri saans li aur chupchaap apni baari ka intezaar kiya."
      en: "Choonchoon took a deep breath and waited quietly for his turn."
    - image: "the chick swinging high and laughing, the little white duckling and the little pink piglet cheering, blue sky"
      hi: "फिर वह ख़ूब ऊँचा झूला! बच्चों, सब्र रखो, अपनी बारी का इंतज़ार करो।"
      hinglish: "Phir woh khoob ooncha jhoola! Bachchon, sabr rakho, apni baari ka intezaar karo."
      en: "Then he swung high up to the sky! Children, be patient and wait for your turn."

- id: 19
  title_hi: "मीरा और दादाजी"
  title_hinglish: "Meera aur Daadaji"
  title_en: "Meera Helps Grandpa"
  character: "a sweet little Indian girl with a short bob haircut, bright eyes, a pink kurta and a red school bag"
  moral_hi: "हमेशा बड़ों की मदद करो।"
  moral_hinglish: "Hamesha badon ki madad karo."
  moral_en: "Always help and respect your elders."
  tags: ["helping elders", "kindness", "kids story"]
  scenes:
    - image: "the girl walking home from school on a sunny colourful street, swinging her arms"
      hi: "मीरा स्कूल से घर लौट रही थी। रास्ते में धूप खिली थी।"
      hinglish: "Meera school se ghar laut rahi thi. Raaste mein dhoop khili thi."
      en: "Meera was walking home from school on a bright sunny day."
    - image: "an old grandfather with white hair, round glasses and a walking stick struggling with a heavy bag of vegetables"
      hi: "उसने एक दादाजी को देखा। उनका थैला बहुत भारी था।"
      hinglish: "Usne ek daadaji ko dekha. Unka thaila bahut bhaari tha."
      en: "On the way, she saw an old grandpa. His bag of vegetables was very heavy."
    - image: "the girl running to the old grandfather with white hair and round glasses with a kind smile"
      hi: "मीरा दौड़कर गई और बोली, 'दादाजी, मैं मदद करूँ?'"
      hinglish: "Meera daudkar gayi aur boli, 'Daadaji, main madad karoon?'"
      en: "Meera ran to him and asked, 'Grandpa, can I help you?'"
    - image: "the girl carrying the vegetable bag, walking slowly beside the old grandfather with a walking stick"
      hi: "उसने थैला उठाया और धीरे धीरे उनके साथ चलने लगी।"
      hinglish: "Usne thaila uthaaya aur dheere dheere unke saath chalne lagi."
      en: "She carried the bag and walked slowly beside him."
    - image: "the old grandfather with white hair and round glasses at his house gate giving the girl a shiny red apple"
      hi: "घर पहुँचकर दादाजी ने उसे लाल सेब दिया। 'जीती रहो, बेटा!'"
      hinglish: "Ghar pahunchkar daadaji ne use laal seb diya. 'Jeeti raho, beta!'"
      en: "At his gate, Grandpa gave her a shiny red apple. 'Bless you, dear child!'"
    - image: "the girl skipping home happily holding the red apple, golden sunset"
      hi: "मीरा का दिल ख़ुशी से भर गया। बच्चों, हमेशा बड़ों की मदद और इज़्ज़त करो।"
      hinglish: "Meera ka dil khushi se bhar gaya. Bachchon, hamesha badon ki madad aur izzat karo."
      en: "Meera's heart was full of joy. Children, always help and respect your elders."

- id: 20
  title_hi: "मोती के जादुई शब्द"
  title_hinglish: "Moti ke Jaadui Shabd"
  title_en: "Moti's Magic Words"
  character: "a playful little white puppy with brown spots, a wagging tail and a yellow collar"
  moral_hi: "हमेशा धन्यवाद कहना मत भूलो।"
  moral_hinglish: "Hamesha dhanyavaad kehna mat bhoolo."
  moral_en: "Never forget to say thank you."
  tags: ["gratitude", "thank you", "puppy story"]
  scenes:
    - image: "a kind cow with a bell around her neck giving the puppy a bowl of milk, the puppy drinking fast and running off, farmyard"
      hi: "गाय माँ ने मोती पिल्ले को दूध दिया। वह पीकर भाग गया।"
      hinglish: "Gaay maa ne Moti pille ko doodh diya. Woh peekar bhaag gaya."
      en: "Kind Mother Cow gave Moti the puppy some milk. He drank it and ran off."
    - image: "a friendly mother hen with a red comb giving the puppy a warm blanket, the puppy grabbing it without a word"
      hi: "मुर्गी माँ ने उसे गरम कंबल दिया। मोती ने कुछ नहीं कहा।"
      hinglish: "Murgi maa ne use garam kambal diya. Moti ne kuch nahin kaha."
      en: "Mother Hen gave him a warm blanket. Moti didn't say a word."
    - image: "the kind cow with a bell and the friendly mother hen with a red comb looking a little sad in the farmyard"
      hi: "गाय माँ और मुर्गी माँ थोड़ी उदास हो गईं।"
      hinglish: "Gaay maa aur murgi maa thodi udaas ho gayin."
      en: "Mother Cow and Mother Hen felt a little sad."
    - image: "a wise old grey owl with round glasses talking softly to the puppy from a wooden fence"
      hi: "उल्लू दादा बोले, 'मोती, जब कोई कुछ दे, तो धन्यवाद बोलते हैं।'"
      hinglish: "Ullu daada bole, 'Moti, jab koi kuch de, toh dhanyavaad bolte hain.'"
      en: "Grandpa Owl said, 'Moti, when someone gives you something, we say thank you.'"
    - image: "the puppy running back to the kind cow with a bell and the friendly mother hen, wagging his tail"
      hi: "मोती दौड़कर गया और बोला, 'थैंक यू गाय माँ! थैंक यू मुर्गी माँ!'"
      hinglish: "Moti daudkar gaya aur bola, 'Thank you gaay maa! Thank you murgi maa!'"
      en: "Moti ran back and said, 'Thank you, Mother Cow! Thank you, Mother Hen!'"
    - image: "the kind cow with a bell and the friendly mother hen with a red comb hugging the happy puppy, flowers and sunshine"
      hi: "दोनों मुस्कुरा उठीं। बच्चों, हमेशा धन्यवाद कहना मत भूलो।"
      hinglish: "Donon muskura utheen. Bachchon, hamesha dhanyavaad kehna mat bhoolo."
      en: "They both smiled big smiles. Children, never forget to say thank you."

- id: 21
  title_hi: "लाल मुर्गी की रोटी"
  title_hinglish: "Laal Murgi ki Roti"
  title_en: "The Little Red Hen"
  character: "a busy little red hen with a golden beak, kind eyes and a white apron"
  moral_hi: "जो मेहनत करता है, फल उसी को मिलता है।"
  moral_hinglish: "Jo mehnat karta hai, phal usi ko milta hai."
  moral_en: "Those who work hard enjoy the reward."
  tags: ["hard work", "little red hen", "moral story"]
  scenes:
    - image: "the hen finding a few wheat seeds on a sunny farm, morning"
      hi: "एक दिन एक लाल मुर्गी को खेत में गेहूँ के कुछ दाने मिले।"
      hinglish: "Ek din ek laal murgi ko khet mein gehoon ke kuch daane mile."
      en: "A little red hen found some wheat seeds on the farm."
    - image: "the hen asking a lazy orange cat with a purple bow, a sleepy brown dog with floppy ears and a playful white duck with a blue cap, all lying around lazily"
      hi: "उसने पूछा, 'कौन मदद करेगा?' बिल्ली, कुत्ता, बतख बोले, 'हम नहीं!'"
      hinglish: "Usne poochha, 'Kaun madad karega?' Billi, kutta, batakh bole, 'Hum nahin!'"
      en: "'Who will help me plant the seeds?' she asked. 'Not me!' said the cat, dog and duck."
    - image: "the hen planting seeds and watering a small wheat field all alone, smiling"
      hi: "मुर्गी ने ख़ुद दाने बोए, पानी दिया और फ़सल काटी।"
      hinglish: "Murgi ne khud daane boye, paani diya aur fasal kaati."
      en: "So she planted them, watered them and cut the wheat all by herself."
    - image: "the hen making dough and cooking golden rotis in a cosy farm kitchen"
      hi: "फिर उसने आटा पीसा और गरम गरम रोटियाँ बनाईं।"
      hinglish: "Phir usne aata peesa aur garam garam rotiyaan banaayin."
      en: "Then she made flour and cooked warm, yummy rotis."
    - image: "the lazy orange cat, the sleepy brown dog and the playful white duck at the kitchen window with hungry eyes"
      hi: "ख़ुशबू आई तो सब दौड़े आए, 'हम भी खाएँगे!'"
      hinglish: "Khushboo aayi toh sab daude aaye, 'Hum bhi khaayenge!'"
      en: "The smell was so good! Everyone came running. 'We want to eat too!'"
    - image: "the hen eating rotis with her fluffy chicks, the lazy orange cat, sleepy brown dog and white duck looking sorry"
      hi: "मुर्गी बोली, 'मेहनत मैंने की है।' बच्चों, जो मेहनत करता है, फल उसी को मिलता है।"
      hinglish: "Murgi boli, 'Mehnat maine ki hai.' Bachchon, jo mehnat karta hai, phal usi ko milta hai."
      en: "'I did all the work,' said the hen. Children, those who work hard enjoy the reward."

- id: 22
  title_hi: "चाँद अपना आकार क्यों बदलता है?"
  title_hinglish: "Chaand apna aakaar kyon badalta hai?"
  title_en: "Why Does the Moon Change Shape?"
  character: "a cute baby owl with fluffy white feathers, huge round golden eyes and a tiny blue nightcap"
  moral_hi: "सवाल पूछने से हम नई चीज़ें सीखते हैं।"
  moral_hinglish: "Sawaal poochhne se hum nayi cheezein seekhte hain."
  moral_en: "Asking questions helps us learn new things."
  tags: ["fun facts for kids", "moon", "science for kids"]
  scenes:
    - image: "the baby owl on a tree branch at night looking up at a thin crescent moon, starry sky"
      hi: "छोटा उल्लू हैरान था। 'चंदा मामा कल गोल थे, आज पतले क्यों हैं?'"
      hinglish: "Chhota ullu hairaan tha. 'Chanda mama kal gol the, aaj patle kyon hain?'"
      en: "Baby Owl was puzzled. 'The moon was round before. Why is it so thin today?'"
    - image: "the baby owl sitting next to a wise old grey owl with round glasses on a branch under the starry sky"
      hi: "दादा उल्लू मुस्कुराए। 'बेटा, चाँद असल में हमेशा गोल ही रहता है।'"
      hinglish: "Daada ullu muskuraaye. 'Beta, chaand asal mein hamesha gol hi rehta hai.'"
      en: "Grandpa Owl smiled. 'The moon is always round, little one.'"
    - image: "a cute simple space scene with a smiling sun shining on one side of a round moon"
      hi: "'चाँद की अपनी रोशनी नहीं होती। सूरज उसे चमकाता है।'"
      hinglish: "'Chaand ki apni roshni nahin hoti. Sooraj use chamkaata hai.'"
      en: "'The moon has no light of its own. The sun shines on it.'"
    - image: "a cute colourful space picture of the moon slowly going around a smiling earth"
      hi: "'चाँद धरती के चारों ओर घूमता है, इसलिए हमें उसका अलग हिस्सा दिखता है।'"
      hinglish: "'Chaand dharti ke chaaron or ghoomta hai, isliye humein uska alag hissa dikhta hai.'"
      en: "'The moon goes around the Earth, so we see a different bright part each night.'"
    - image: "a row of glowing moon shapes from thin crescent to half to full moon in the night sky, the baby owl amazed"
      hi: "'कभी पूरा चाँद, कभी आधा, कभी पतला। अमावस को दिखता ही नहीं!'"
      hinglish: "'Kabhi poora chaand, kabhi aadha, kabhi patla. Amaavas ko dikhta hi nahin!'"
      en: "'Sometimes it's full, sometimes half, sometimes thin, and sometimes we can't see it at all!'"
    - image: "the baby owl happily hugging the wise old grey owl with round glasses under a big bright full moon"
      hi: "छोटा उल्लू ख़ुश हुआ। बच्चों, सवाल पूछो, हर सवाल से कुछ नया सीखते हैं।"
      hinglish: "Chhota ullu khush hua. Bachchon, sawaal poochho, har sawaal se kuch naya seekhte hain."
      en: "Baby Owl hooted happily. Children, keep asking questions. Every question teaches something new!"

- id: 23
  title_hi: "बीज से पेड़ कैसे बनता है?"
  title_hinglish: "Beej se ped kaise banta hai?"
  title_en: "How Does a Seed Become a Tree?"
  character: "a curious little Indian boy with big round glasses, messy black hair and an orange t-shirt"
  moral_hi: "पेड़ लगाओ, उनकी देखभाल करो और धीरज रखो।"
  moral_hinglish: "Ped lagaao, unki dekhbhaal karo aur dheeraj rakho."
  moral_en: "Plant trees, care for them and be patient."
  tags: ["fun facts for kids", "plants", "science for kids"]
  scenes:
    - image: "the boy holding a tiny mango seed in his palm in a sunny garden, looking curious"
      hi: "छोटू ने आम खाकर उसकी गुठली पकड़ी। 'क्या इससे पेड़ बनेगा?'"
      hinglish: "Chhotu ne aam khaakar uski guthli pakdi. 'Kya isse ped banega?'"
      en: "Chotu ate a mango and held its seed. 'Can this become a tree?'"
    - image: "the boy digging a small hole and planting the seed in soft brown soil"
      hi: "उसने मिट्टी में एक छोटा गड्ढा किया और बीज बो दिया।"
      hinglish: "Usne mitti mein ek chhota gaddha kiya aur beej bo diya."
      en: "He dug a little hole in the soil and planted the seed."
    - image: "the boy watering the soil with a small green watering can, bright sunshine above"
      hi: "बीज को चाहिए पानी, धूप और हवा। छोटू रोज़ उसे पानी देता।"
      hinglish: "Beej ko chahiye paani, dhoop aur hawa. Chhotu roz use paani deta."
      en: "A seed needs water, sunshine and air. Chotu watered it every day."
    - image: "a tiny green sprout with two leaves popping out of the soil, the boy jumping with joy"
      hi: "कुछ दिन बाद मिट्टी से एक नन्हा हरा पौधा निकला!"
      hinglish: "Kuch din baad mitti se ek nanha hara paudha nikla!"
      en: "After some days, a tiny green sprout popped out of the soil!"
    - image: "the boy standing next to a young leafy plant that has grown as tall as him, smiling proudly"
      hi: "धीरे धीरे पौधा बड़ा होता गया, और एक दिन बन गया पेड़।"
      hinglish: "Dheere dheere paudha bada hota gaya, aur ek din ban gaya ped."
      en: "Slowly, slowly, the little plant grew taller and became a tree."
    - image: "the boy sitting happily under a big mango tree full of ripe mangoes, sunny day"
      hi: "अब उस पर मीठे आम लगते हैं! बच्चों, पेड़ लगाओ और धीरज रखो।"
      hinglish: "Ab us par meethe aam lagte hain! Bachchon, ped lagaao aur dheeraj rakho."
      en: "Now it gives sweet mangoes! Children, plant trees, care for them and be patient."

- id: 24
  title_hi: "बारिश कहाँ से आती है?"
  title_hinglish: "Baarish kahaan se aati hai?"
  title_en: "Where Does Rain Come From?"
  character: "a happy little white cloud with rosy cheeks, sparkling blue eyes and a tiny rainbow scarf"
  moral_hi: "पानी हम सबका दोस्त है, इसे बचाओ।"
  moral_hinglish: "Paani hum sabka dost hai, ise bachaao."
  moral_en: "Water is everyone's friend, so let's save it."
  tags: ["fun facts for kids", "rain", "science for kids"]
  scenes:
    - image: "the little cloud floating in a bright blue sky over a sparkling sea, waving hello"
      hi: "मैं हूँ बादलू, एक छोटा बादल! बताऊँ बारिश कैसे होती है?"
      hinglish: "Main hoon Baadlu, ek chhota baadal! Bataaoon baarish kaise hoti hai?"
      en: "Hi, I'm Badlu, a little cloud! Want to know where rain comes from?"
    - image: "a smiling sun shining warmly on the sea, tiny smiling water drops rising up as mist, the little cloud above"
      hi: "सूरज समुंदर का पानी गरम करता है। पानी भाप बनकर ऊपर उड़ता है।"
      hinglish: "Sooraj samundar ka paani garam karta hai. Paani bhaap bankar upar udta hai."
      en: "The sun warms the water in the sea. The water turns into vapour and floats up."
    - image: "tiny smiling water drops joining the little cloud high in the cool sky"
      hi: "ऊपर ठंडी हवा में भाप छोटी बूँदें बनकर मुझसे मिल जाती है।"
      hinglish: "Upar thandi hawa mein bhaap chhoti boondein bankar mujhse mil jaati hai."
      en: "High up in the cool air, it turns into tiny drops that join me."
    - image: "the little cloud getting bigger, puffy and grey, full of drops, looking heavy but cheerful"
      hi: "बूँदें बढ़ती जाती हैं, और मैं भारी और काला हो जाता हूँ।"
      hinglish: "Boondein badhti jaati hain, aur main bhaari aur kaala ho jaata hoon."
      en: "More and more drops come, and I become big, grey and heavy."
    - image: "rain falling from the little cloud onto green fields, happy children with colourful umbrellas and jumping frogs"
      hi: "फिर टप टप टप! बूँदें बारिश बनकर धरती पर गिरती हैं।"
      hinglish: "Phir tap tap tap! Boondein baarish bankar dharti par girti hain."
      en: "Then pitter-patter! The drops fall down as rain on the earth."
    - image: "a bright rainbow over green fields and blooming flowers, the little cloud small and white again, smiling"
      hi: "बारिश से पेड़ पौधे ख़ुश होते हैं। बच्चों, पानी हम सबका दोस्त है, इसे बचाओ।"
      hinglish: "Baarish se ped paudhe khush hote hain. Bachchon, paani hum sabka dost hai, ise bachaao."
      en: "Rain makes plants and animals happy. Children, water is everyone's friend, so let's save it."

- id: 25
  title_hi: "इल्ली से तितली"
  title_hinglish: "Illi se Titli"
  title_en: "From Caterpillar to Butterfly"
  character: "a curious little Indian girl with two braids, big eyes and a purple frock, holding a magnifying glass"
  moral_hi: "सुंदर बदलाव में समय लगता है, धीरज रखो।"
  moral_hinglish: "Sundar badlaav mein samay lagta hai, dheeraj rakho."
  moral_en: "Beautiful changes take time, so be patient."
  tags: ["fun facts for kids", "butterfly", "science for kids"]
  scenes:
    - image: "the girl looking at a tiny white egg on a green leaf through her magnifying glass in a sunny garden"
      hi: "रिया ने पत्ते पर एक छोटा सा अंडा देखा। 'ये किसका है?'"
      hinglish: "Riya ne patte par ek chhota sa anda dekha. 'Ye kiska hai?'"
      en: "Riya saw a tiny egg on a leaf. 'Whose egg is this?' she wondered."
    - image: "a cute little green caterpillar with big eyes coming out of the egg on the leaf, the girl smiling"
      hi: "अंडे से एक नन्ही इल्ली निकली। और वह बहुत भूखी थी!"
      hinglish: "Ande se ek nanhi illi nikli. Aur woh bahut bhookhi thi!"
      en: "Out came a tiny caterpillar. And it was very, very hungry!"
    - image: "the cute little green caterpillar with big eyes munching leaves and growing plump, the girl giggling"
      hi: "इल्ली ने ख़ूब पत्ते खाए और मोटी ताज़ी हो गई।"
      hinglish: "Illi ne khoob patte khaaye aur moti taazi ho gayi."
      en: "It munched and munched on leaves and grew big and fat."
    - image: "a green cocoon hanging from a twig, the girl watching patiently with her chin in her hands"
      hi: "फिर उसने अपने चारों ओर एक घर बनाया, जिसे कोकून कहते हैं।"
      hinglish: "Phir usne apne chaaron or ek ghar banaaya, jise cocoon kehte hain."
      en: "Then it made a cosy little house around itself, called a cocoon."
    - image: "a beautiful butterfly with colourful orange and blue wings coming out of the cocoon with sparkles, the girl amazed"
      hi: "कुछ दिन बाद कोकून खुला, और निकली एक रंग बिरंगी तितली!"
      hinglish: "Kuch din baad cocoon khula, aur nikli ek rang birangi titli!"
      en: "After some days, the cocoon opened, and out came a beautiful butterfly!"
    - image: "the beautiful butterfly with colourful orange and blue wings flying among flowers, the girl waving happily"
      hi: "रिया ख़ुशी से उछली। बच्चों, सुंदर बदलाव में समय लगता है, धीरज रखो।"
      hinglish: "Riya khushi se uchhli. Bachchon, sundar badlaav mein samay lagta hai, dheeraj rakho."
      en: "Riya clapped with joy. Children, beautiful changes take time, so be patient."

- id: 26
  title_hi: "इंद्रधनुष कैसे बनता है?"
  title_hinglish: "Indradhanush kaise banta hai?"
  title_en: "How Is a Rainbow Made?"
  character: "a cute little peacock chick with shiny blue feathers, big sparkly eyes and a tiny golden crown"
  moral_hi: "प्रकृति को देखो, सीखो और उसके रंगों का मज़ा लो।"
  moral_hinglish: "Prakriti ko dekho, seekho aur uske rangon ka maza lo."
  moral_en: "Look at nature, learn from it and enjoy its colours."
  tags: ["fun facts for kids", "rainbow", "science for kids"]
  scenes:
    - image: "the peacock chick dancing happily in a green meadow just after the rain, shiny raindrops on the grass"
      hi: "बारिश रुकी, तो मोरू मोर ख़ुशी से नाचने लगा।"
      hinglish: "Baarish ruki, toh Moru mor khushi se naachne laga."
      en: "When the rain stopped, Moru the little peacock started dancing."
    - image: "a big bright rainbow appearing in the sky, the peacock chick staring with wide eyes"
      hi: "तभी आसमान में सात रंगों का इंद्रधनुष निकला! 'वाह! ये कैसे बना?'"
      hinglish: "Tabhi aasmaan mein saat rangon ka indradhanush nikla! 'Waah! Ye kaise bana?'"
      en: "Suddenly, a rainbow with seven colours appeared! 'Wow! How did that happen?'"
    - image: "the friendly smiling sun peeking out from behind fluffy clouds, talking to the peacock chick"
      hi: "सूरज दादा बोले, 'मेरी रोशनी में सारे रंग छुपे होते हैं।'"
      hinglish: "Sooraj daada bole, 'Meri roshni mein saare rang chhupe hote hain.'"
      en: "Grandpa Sun smiled. 'My light has all the colours hidden inside it.'"
    - image: "a ray of sunlight going through a big sparkly raindrop and spreading into rainbow colours, cute and simple"
      hi: "'जब रोशनी बारिश की बूँदों से गुज़रती है, तो रंग अलग हो जाते हैं।'"
      hinglish: "'Jab roshni baarish ki boondon se guzarti hai, toh rang alag ho jaate hain.'"
      en: "'When my light passes through raindrops, the colours spread out.'"
    - image: "the peacock chick pointing at each colour of the rainbow, smiling, the friendly smiling sun shining"
      hi: "'लाल, नारंगी, पीला, हरा, आसमानी, नीला, बैंगनी, सब दिखने लगते हैं!'"
      hinglish: "'Laal, naarangi, peela, hara, aasmaani, neela, baingani, sab dikhne lagte hain!'"
      en: "'Red, orange, yellow, green, blue, indigo and violet, all come out to play!'"
    - image: "the peacock chick dancing happily under the rainbow, flowers everywhere"
      hi: "मोरू ख़ुशी से नाचा। बच्चों, प्रकृति को देखो, सीखो और उसके रंगों का मज़ा लो।"
      hinglish: "Moru khushi se naacha. Bachchon, prakriti ko dekho, seekho aur uske rangon ka maza lo."
      en: "Moru danced with joy. Children, enjoy nature's colours and keep asking how things work!"

- id: 27
  title_hi: "कबूतरी और चींटी"
  title_hinglish: "Kabootari aur Cheenti"
  title_en: "The Dove and the Ant"
  character: "a gentle white dove with soft fluffy feathers, kind black eyes and a small pink ribbon on her neck"
  moral_hi: "दूसरों की मदद करो, अच्छाई लौटकर आती है।"
  moral_hinglish: "Doosron ki madad karo, achchhaai lautkar aati hai."
  moral_en: "Help others; kindness always comes back to you."
  tags: ["dove and ant", "aesop", "kindness"]
  scenes:
    - image: "a tiny black ant with a red cap floating on the water of a stream, waving for help, the dove watching from a tree"
      hi: "एक दिन एक छोटी चींटी नदी में गिर गई। 'बचाओ! बचाओ!'"
      hinglish: "Ek din ek chhoti cheenti nadi mein gir gayi. 'Bachaao! Bachaao!'"
      en: "A tiny ant fell into the river. 'Help! Help!' she cried."
    - image: "the dove dropping a big green leaf into the stream near the tiny black ant with a red cap"
      hi: "पेड़ पर बैठी कबूतरी ने एक बड़ा पत्ता पानी में गिरा दिया।"
      hinglish: "Ped par baithi kabootari ne ek bada patta paani mein gira diya."
      en: "A kind dove on a tree dropped a big leaf into the water."
    - image: "the tiny black ant with a red cap riding the leaf safely to the shore, smiling, the dove happy"
      hi: "चींटी पत्ते पर चढ़ गई और किनारे पहुँच गई। 'धन्यवाद!'"
      hinglish: "Cheenti patte par chadh gayi aur kinaare pahunch gayi. 'Dhanyavaad!'"
      en: "The ant climbed onto the leaf and floated safely to the shore. 'Thank you!'"
    - image: "a naughty village boy with a blue cap aiming a slingshot at the dove sitting on a branch"
      hi: "कुछ दिन बाद एक शरारती लड़का गुलेल से कबूतरी पर निशाना लगा रहा था।"
      hinglish: "Kuch din baad ek sharaarti ladka gulel se kabootari par nishaana laga raha tha."
      en: "A few days later, a naughty boy aimed his slingshot at the dove."
    - image: "the naughty boy with a blue cap hopping and saying ouch as the tiny black ant bites his foot, the dove flying away safely"
      hi: "चींटी ने उसके पैर पर ज़ोर से काटा। 'उई!' निशाना चूका, कबूतरी उड़ गई।"
      hinglish: "Cheenti ne uske pair par zor se kaata. 'Ui!' Nishaana chooka, kabootari ud gayi."
      en: "The ant bit his foot hard. 'Ouch!' He missed, and the dove flew away safely."
    - image: "the dove and the tiny black ant with a red cap smiling at each other on a branch, golden sunset"
      hi: "दोनों पक्के दोस्त बन गए। बच्चों, दूसरों की मदद करो, अच्छाई लौटकर आती है।"
      hinglish: "Donon pakke dost ban gaye. Bachchon, doosron ki madad karo, achchhaai lautkar aati hai."
      en: "They became best friends. Children, always help others. Kindness always comes back to you."

- id: 28
  title_hi: "कबूतर और जाल"
  title_hinglish: "Kabootar aur Jaal"
  title_en: "The Pigeons and the Net"
  character: "a wise old pigeon king with grey-blue feathers, kind orange eyes and a tiny golden crown"
  moral_hi: "एकता में बड़ी ताक़त होती है।"
  moral_hinglish: "Ekta mein badi taaqat hoti hai."
  moral_en: "When we work together, we become strong."
  tags: ["pigeons and net", "panchatantra", "unity"]
  scenes:
    - image: "the pigeon king leading a flock of grey pigeons flying over green fields, sunny sky"
      hi: "कबूतरों का एक झुंड अपने राजा के साथ आसमान में उड़ रहा था।"
      hinglish: "Kabootaron ka ek jhund apne raja ke saath aasmaan mein ud raha tha."
      en: "A flock of pigeons was flying in the sky with their wise king."
    - image: "rice grains scattered on the ground, a flock of grey pigeons landing to eat, a rope net over them"
      hi: "नीचे चावल के दाने दिखे। सब खाने उतरे और जाल में फँस गए!"
      hinglish: "Neeche chaawal ke daane dikhe. Sab khaane utre aur jaal mein phans gaye!"
      en: "They saw rice on the ground, flew down to eat, and got stuck in a net!"
    - image: "grey pigeons flapping under the rope net, the pigeon king calm and speaking to them"
      hi: "राजा बोला, 'घबराओ मत! सब मिलकर एक साथ ज़ोर से उड़ो।'"
      hinglish: "Raja bola, 'Ghabraao mat! Sab milkar ek saath zor se udo.'"
      en: "The king said, 'Don't panic! Let's all fly up together, at the same time.'"
    - image: "the pigeon king and the flock of grey pigeons flying up together, carrying the whole rope net into the sky"
      hi: "एक, दो, तीन! सब एक साथ उड़े और जाल लेकर आसमान में पहुँच गए।"
      hinglish: "Ek, do, teen! Sab ek saath ude aur jaal lekar aasmaan mein pahunch gaye."
      en: "One, two, three! They flapped together and flew up with the whole net."
    - image: "the pigeons landing near a big tree, a tiny brown mouse with round ears happily nibbling the net"
      hi: "राजा के दोस्त चूहे ने जाल काटकर सबको आज़ाद कर दिया।"
      hinglish: "Raja ke dost choohe ne jaal kaatkar sabko aazaad kar diya."
      en: "The king's friend, a little mouse, cut the net and set everyone free."
    - image: "the pigeon king, the grey pigeons and the tiny brown mouse with round ears celebrating together, blue sky"
      hi: "सब ख़ुशी से उड़ गए। बच्चों, एकता में बड़ी ताक़त होती है।"
      hinglish: "Sab khushi se ud gaye. Bachchon, ekta mein badi taaqat hoti hai."
      en: "Everyone flew away happily. Children, when we work together, we become strong."

- id: 29
  title_hi: "चतुर खरगोश और शेर"
  title_hinglish: "Chatur Khargosh aur Sher"
  title_en: "The Clever Rabbit and the Lion"
  character: "a clever little white rabbit with long ears, a bright pink nose and a green scarf"
  moral_hi: "ताक़त से बड़ी होती है अक़्ल।"
  moral_hinglish: "Taaqat se badi hoti hai akl."
  moral_en: "A clever mind is stronger than big muscles."
  tags: ["clever rabbit", "panchatantra", "moral story"]
  scenes:
    - image: "a big grumpy lion with a messy golden mane roaring in the jungle, little animals hiding behind bushes"
      hi: "जंगल में एक घमंडी शेर रहता था। वह सबको डराता था।"
      hinglish: "Jungle mein ek ghamandi sher rehta tha. Woh sabko daraata tha."
      en: "A proud, grumpy lion lived in the jungle. He scared all the animals."
    - image: "jungle animals standing in a worried line, the rabbit thinking with a clever look"
      hi: "रोज़ एक जानवर को उसके पास जाना पड़ता था। आज खरगोश की बारी थी।"
      hinglish: "Roz ek jaanvar ko uske paas jaana padta tha. Aaj khargosh ki baari thi."
      en: "Every day, one animal had to go to him. Today, it was the rabbit's turn."
    - image: "the rabbit arriving late, the big grumpy lion with a messy golden mane tapping his paw angrily"
      hi: "खरगोश जानबूझकर देर से पहुँचा। शेर गुस्से में दहाड़ा, 'इतनी देर क्यों?'"
      hinglish: "Khargosh jaanboojhkar der se pahuncha. Sher gusse mein dahaada, 'Itni der kyon?'"
      en: "The rabbit went very late on purpose. The lion roared, 'Why are you so late?'"
    - image: "the rabbit telling a story with big hand movements, pointing toward an old stone well, the grumpy lion listening"
      hi: "खरगोश बोला, 'रास्ते में दूसरा शेर मिला। वो कहता है, जंगल उसका है!'"
      hinglish: "Khargosh bola, 'Raaste mein doosra sher mila. Woh kehta hai, jungle uska hai!'"
      en: "The rabbit said, 'I met another lion on the way. He says this jungle is his!'"
    - image: "the big grumpy lion with a messy golden mane peering into an old stone well at his own reflection, water splashing"
      hi: "शेर ने कुएँ में अपनी परछाई देखी और गुस्से में कूद गया। छपाक!"
      hinglish: "Sher ne kuen mein apni parchhaai dekhi aur gusse mein kood gaya. Chhapaak!"
      en: "The lion looked into a well, saw his own reflection, and jumped in angrily. Splash!"
    - image: "the rabbit and happy jungle animals dancing together in a sunny clearing"
      hi: "घमंडी शेर फिर कभी नहीं लौटा। बच्चों, ताक़त से बड़ी होती है अक़्ल।"
